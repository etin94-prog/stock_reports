<h1>핵심만, 차분하게</h1><p class="intro">종목별로 지금 읽어야 할 근거와 주의점을 모았습니다.</p>
<p class="notice">저장된 심층 보고서의 요약입니다. 가격 기준일이 종목마다 다를 수 있습니다. 아래 근거는 저평가 확정이나 매수 신호가 아니며, 기관 전망·미확인 가정을 포함합니다.</p>
<div class="search"><label for="stock-search">종목 찾기</label><input id="stock-search" type="search" placeholder="종목명 또는 코드" autocomplete="off"><p id="result-count" role="status" aria-live="polite"></p></div>
<div class="grid"></div><p id="empty" hidden>일치하는 종목이 없습니다. 종목명이나 코드를 다시 확인해 주세요.</p>
</main><script>(()=>{const input=document.getElementById('stock-search'),cards=[...document.querySelectorAll('article[data-name]')];function filter(){const q=input.value.trim().toLocaleLowerCase();let n=0;cards.forEach(card=>{card.hidden=!card.dataset.name.toLocaleLowerCase().includes(q);if(!card.hidden)n++;});document.getElementById('result-count').textContent=n+'개 종목';document.getElementById('empty').hidden=n!==0;}input.addEventListener('input',filter);filter();})();</script></body></html>
