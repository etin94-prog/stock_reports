&lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;ES큐브&lt;small&gt;050120&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;3,280원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;ES큐브 — 최근 1년 한 달에 6억씩 손해 보는 회사.&lt;/div&gt;&lt;div class=&quot;src&quot; style=&quot;margin-top:6px&quot;&gt;💡 영업은 최근 1년 72억 적자예요 — 순이익이 +48억 흑자인 건 25.3Q 영업 밖 이익(순이익 +37억) 때문이라 &amp;#x27;버는 돈&amp;#x27; 으로 보지 않았어요.&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;💵 최근 1년 한 달 6억 손해&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;🛟 장부상 순자산이 회사값보다 116% 많아요&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-10-02 05:53 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · ES큐브&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 1977년 텐트 및 아웃도어 용품 제조 판매 사업으로 설립되어 2002년 코스닥시장에 상장됨. 중국과 베트남 소재 100% 자회사에서 레저 및 기능성 텐트를 생산하여 일본, 북미, 유럽 등 세계 빅바이어에게 수출하는 텐트사업을 영위하고 있음. ODM 및 OEM 방식으로 매출이 발생하며, 중국과 베트남 법인에 연구개발 조직을 두고 자체 개발능력과 우수한 품질을 기반으로 하이엔드 제품 시장을 선도하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;최근 1년(25.3Q~26.2Q) 영업손실 72억 — 분기 평균 18억&lt;/li&gt;&lt;li class=q&gt;적자가 줄고 있어요: 최근 두 분기 1억 vs 그 전 두 분기 70억&lt;/li&gt;&lt;li class=q&gt;사업부문 주요 사업내용 회사명 텐트사업부문 레저 및 기능성 텐트 제조 청도경조여유용품유한공사고밀화신여유용품유한공사T.O.P OUTDOOR VINA CO., LTD. 당사는 판매사(Brand)에게 개발된 제품을 소개하면서 고객이 원하는 브랜드로 제품을 납품하는 ODM방식과 주문자의 요청에 따른 모델을 생산하는 OEM방식으로 매출이 발생합니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · DART 분기 손익 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260701000629&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;또한 글로벌 캠핑장비 시장 규모는 2020년대 중반 이후에도 안정적인 성장률을 유지하며 확대될 것으로 전망되고 있어, 지역별 수요 기반 확대와 함께 산업 전반의 외형 성장이 지속될 것으로 예상됩니다.&lt;/li&gt;&lt;li class=q&gt;또한 동 보고서는 시장규모가 2024년부터 연평균 8.48% 성장하여 2032년에는 1,722억달러 규모가 될 것으로 전망하고 있습니다.&lt;/li&gt;&lt;li class=q&gt;2023년 이후로는 코로나19 엔데믹에 따라 비대면 여가생활의 수요는 통상수준의 성장기로 회귀하고, 글로벌 경기침체가 지속되고 있어 아웃도어 산업은 소비회복시기까지 영향을 받을 전망이며, 각국의 캠핑시장 성장수준에 따라 차이를 보일 것으로 예상합니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260701000629&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;증권사 추정이 2곳 미만이라 비워 뒀어요&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;2023년 들어 각국은 코로나19 엔데믹을 선언하였고, 전세계적 인플레이션과 환율변동의 영향으로 판매사(Brand)들의 재고가 증가하였습니다.&lt;/li&gt;&lt;li class=q&gt;레저용 텐트산업은 주로 중산층의 레저활동에 필요한 제품을 생산, 판매하는 산업부문으로 전세계 중산층이 확대되는 과정에서 과거에 비해 경기변동 영향력은 꾸준히 감소해 왔습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260701000629&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 1977년 텐트 및 아웃도어 용품 제조 판매 사업으로 설립되어 2002년 코스닥시장에 상장됨. 중국과 베트남 소재 100% 자회사에서 레저 및 기능성 텐트를 생산하여 일본, 북미, 유럽 등 세계 빅바이어에게 수출하는 텐트사업을 영위하고 있음. ODM 및 OEM 방식으로 매출이 발생하며, 중국과 베트남 법인에 연구개발 조직을 두고 자체 개발능력과 우수한 품질을 기반으로 하이엔드 제품 시장을 선도하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 당사는 레저 및 기능성 텐트 제조사업을 영위하고 있습니다. 한국채택국제회계기준 도입에 의한 연결대상 종속회사가 영위하는 사업으로는 레저 및 기능성 텐트 제조 및 판매업이 있으며, 회사의 현황은 다음과 같습니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;사업보고서 매출 표를 재무제표와 맞추지 못해 표는 뺐어요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;⚠️ 나빠질 수 있는 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;최근 1년 적자예요 — 흑자 전환이 늦어지면 돈을 더 구해야 할 수 있어요&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 손익&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트에 적힌 위험과 우리가 계산한 신호&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🩺 기초 체력&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💵&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;최근 1년 한 달에 약 6억씩 손해였어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💰&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;2025년 한 해로 보면 번 만큼 현금도 들어왔어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🧩&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;3년간 그대로예요 — 내 몫이 유지돼요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;밸류 — PER 9.3배(최근 4분기) · PBR 0.46배(최근 분기)&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;이익은 최근 4분기 실제(네이버), 배당은 최근 배당수익률(세전), 은행은 COFIX 신규취급액 3.18%(09/15)&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📐 10년 가격표 — 지금 싼 편일까?&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;이 회사의 지난 10년 PER·PBR 과 비교한 지금 위치 · 싸다고 오른다는 뜻은 아니에요&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px&quot;&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;1주&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:800;color:#2563eb&quot;&gt;-0.3%&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;paddi ;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;⚠️ 체크할 점&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;•&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;작년 순이익이 적자예요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;사실 대비만 적어요 — 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div id=&quot;toss&quot;&gt;&lt;section class=&quot;t-card t-dark&quot;&gt;&lt;div class=&quot;t-s&quot; style=&quot;margin:0&quot;&gt;ES큐브 · 050120&lt;/div&gt;&lt;div class=&quot;t-px&quot;&gt;3,280원&lt;/div&gt;&lt;div class=&quot;t-hl&quot;&gt;ES큐브 — 최근 1년 한 달에 6억씩 손해 보는 회사.&lt;/div&gt;&lt;div class=&quot;t-s&quot; style=&quot;margin:6px 0 0;color:#d1d6db&quot;&gt;💡 영업은 최근 1년 72억 적자예요 — 순이익이 +48억 흑자인 건 25.3Q 영업 밖 이익(순이익 +37억) 때문이라 &amp;#x27;버는 돈&amp;#x27; 으로 보지 않았어요.&lt;/div&gt;&lt;div class=&quot;t-chips&quot;&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#fdba74&quot;&gt;💵 최근 1년 한 달 6억 손해&lt;/span&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#6ee7b7&quot;&gt;🛟 장부상 순자산이 회사값보다 116% 많아요&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;t-card&quot;&gt;&lt;p class=&quot;t-h&quot;&gt;🏢 무슨 회사?&lt;/p&gt;&lt;p class=&quot;t-a&quot; style=&quot;font-size:14px;font-weight:600;line-height:1.6;color:#333d4b&quot;&gt;동사는 1977년 텐트 및 아웃도어 용품 제조 판매 사업으로 설립되어 2002년 코스닥시장에 상장됨. 중국과 베트남 소재 100% 자회사에서 레저 및 기능성 텐트를 생산하여 일본, 북미, 유럽 등 세계 빅바이어에게 수출하는 텐트사업을 영위하고 있음.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;t-card&quot;&gt;&lt;p class=&quot;t-h&quot;&gt;🗓️ 앞으로 확인할 것&lt;/p&gt;&lt;p class=&quot;t-s&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황&lt;/p&gt;&lt;div class=&quot;t-row&quot;&gt;&lt;div class=&quot;t-dot&quot; style=&quot;background:#2563eb;font-size:12px;font-weight:800&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;t-a&quot; style=&quot;font-size:15px&quot;&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/div&gt;&lt;div class=&quot;t-q&quot; style=&quot;color:#8b95a1&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt; imer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 신도기연&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 2000년 설립된 디스플레이 장비 전문 기업으로, 2020년 코스닥에 상장하였으며, 1개의 비상장 종속회사를 보유하고 있음. OLED, 폴더블, 마이크로LED 등 디스플레이 패널 제조용 합착기, 탈포기 등을 공급하며, 세계 최초 매엽식 탈포기와 곡면 진공합착기를 개발해 기술력을 인정받았음. 핵심 기술을 바탕으로 수소연료전지 MEA 제조장비, 스마트윈도 제조장비 등 신규 사업으로 확장하여 신규 성장동력을 확보하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;기타 — &lt;b&gt;81%&lt;/b&gt; · 260억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:81%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;합착기 — &lt;b&gt;13%&lt;/b&gt; · 43억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:13%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;용역 및 부품 등 — &lt;b&gt;5%&lt;/b&gt; · 15억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:5%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;ul&gt;&lt;li class=q&gt;최근 1년(25.3Q~26.2Q) 영업손실 53억 — 분기 평균 13억&lt;/li&gt;&lt;li class=q&gt;적자가 늘고 있어요: 최근 두 분기 92억 vs 그 전 두 분기 -39억&lt;/li&gt;&lt;li class=q&gt;또한, 합착 공정과 관련한 Glass 로딩/언로딩, C/F 공급 및 부착, 세정, 진공 합착 등의 세부 공정 장비들을 자체적으로 설계, 제작하여 전자동(인라인)화 하였으며, 이를 통하여 높은 수율을 확보하고 안정된 품질의 제품을 생산할 수 있는 대량 생산체제를 갖출 수 있도록 하는 장비를 납품하여 국내외 고객사로부터 뛰어난 기술력을 인정받고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · DART 분기 손익 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323000716&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;(나) 디스플레이 장비 시장 규모 및 전망 당사가 생산하는 제품인 합착기와 탈포기만을 별도로 구분한 시장 규모 현황 자료는 없으나, 한국디스플레이산업협회가 발간한 디스플레이산업 주요 통계(2025.Vol.4)에 의하면 합착기와 탈포기가 속한 디스플레이 제조 후공정(Cell+Module 공정) 부문의 장비 시장규모는 2025년 약 14억 달러로 추정됩니다.&lt;/li&gt;&lt;li class=q&gt;[디스플레이 공정별 장비 시장 규모 및 전망] 세계 디스플레이 장비시장 현황 및   세계 디스플레이 장비시장 현황 및 전망 (출처 : 한국디스플레이산업협회 2026.02) (3) 경기 변동의 특성 디스플레이 장비산업 경기는 디스플레이 패널 수요에 절대적인 영향을 받습니다.&lt;/li&gt;&lt;li class=q&gt;【스마트 윈도 제조 공정】 스마트 윈도 제조   스마트 윈도 제조 공정 (출처: 신도기연) ㉯ 스마트 윈도 장비 판매 전망 현재 액정기반 방식의 스마트윈도 대한 시장 규모와 판매 전망을 예측한 자료는 아직 없으며 스마트 윈도 시장을 통틀어 발표한 자료에 의하면 매년 성장하여 전세계적으로 2031년에는 약 234억 달러 규모의 시장이 형성될 것으로 예상되고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323000716&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;증권사 추정이 2곳 미만이라 비워 뒀어요&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;2020년 국내 디스플레이 패널 업체 점유율은 87.3%였으나 2025년 3분기에는 점유율이 67.5%로 하락하였습니다.&lt;/li&gt;&lt;li class=q&gt;(4) 경쟁 상황(가) 합착기 경쟁 상황 초기의 스마트폰은 LCD 패널 및 구부러지지 않는 Rigid OLED 패널을 부착하여 생산되었습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323000716&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 2000년 설립된 디스플레이 장비 전문 기업으로, 2020년 코스닥에 상장하였으며, 1개의 비상장 종속회사를 보유하고 있음. OLED, 폴더블, 마이크로LED 등 디스플레이 패널 제조용 합착기, 탈포기 등을 공급하며, 세계 최초 매엽식 탈포기와 곡면 진공합착기를 개발해 기술력을 인정받았음. 핵심 기술을 바탕으로 수소연료전지 MEA 제조장비, 스마트윈도 제조장비 등 신규 사업으로 확장하여 신규 성장동력을 확보하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;기타&lt;/span&gt;&lt;b&gt;260억 (81%) · 전년 +508%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:81%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;합착기&lt;/span&gt;&lt;b&gt;43억 (13%) · 전년 +113%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:13%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;용역 및 부품 등&lt;/span&gt;&lt;b&gt;15억 (5%) · 전년 -56%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:5%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;탈포기&lt;/span&gt;&lt;b&gt;6,400.0만원 (0%) · 전년 -92%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:0%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 당사는 디스플레이제조장비 등을 개발하여 국내외 기업에 제작 판매하는 사업을 영위하고 있습니다. 특히 세계최초로 2004년에는 미세기포를 제거하는 매엽식 탈포기(STA), 2015년에는 곡면(3D) 형태의 디스플레이 패널을 합착할 수 있는 곡면 진공합착기(3D Laminator) 등을 개발하여 국내외기업으로부터 기술력을 인정받았습니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서 2025 매출 표 — 재무제표 매출과 대조해 맞은 표만 보여 줘요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;⚠️ 나빠질 수 있는 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;최근 1년 적자예요 — 흑자 전환이 늦어지면 돈을 더 구해야 할 수 있어요&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 손익&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트에 적힌 위험과 우리가 계산한 신호&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🩺 기초 체력&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💵&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;최근 1년 한 달에 약 1억씩 손해였어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💰&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;2025년 한 해로 보면 이익은 났는데 현금은 오히려 빠져나갔어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🧩&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&g color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · KTis&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 2001년 KT의 114번호안내서비스 사업부문이 분사하여 설립되었으며, 2010년 유가증권시장에 상장됨. 2025년 하반기 금융업종 전문 운영사인 에이치엔씨네트워크를 100% 인수 후 흡수합병하여 금융업종 레퍼런스를 강화함. KT고객센터, 일반컨택센터, 유통사업, 번호안내사업 등을 영위하며, 2025년 매출 기준 KT고객센터 45%, 일반컨택센터 32%, 유통 19%, 번호안내 3%, 기타 1%로 구성됨.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;축적된 DX 수행 역량과콜센터 운영 노하우를 토대로 고객 서비스 품질을 획기적으로 개선하고 있으며, 지속적인 기술 혁신과 고객 중심 서비스 제공을 통해 고객의 디지털 혁신 파트너로서 거듭날 계획입니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323001433&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;향후 컨택센터 아웃소싱 시장의 고성장세는 대형센터 구축 수요감소 등으로 인해 다소 완만해 질 것으로 예상되나, 그럼에도 불구하고 BPO(Business Process Outsourcing)에 대한 인식변화와 ASP, CRM 기반 확보를 위한 WFMS (Work Force Management System) 구축 등 신규시장의 확대로 지속적인 성장을 예상하고 있습니다.&lt;/li&gt;&lt;li class=q&gt;시장조사업체 얼라이드마켓리서치에서 조사한 자료에따르면 국내 AICC 시장 규모는 &amp;#x27;20년 4,214만달러(약 581억원) 규모에서 &amp;#x27;30년 3억 5,088만달러(4,840억원) 규모로 연평균 23.7%의 성장을 전망하고 있습니다.&lt;/li&gt;&lt;li class=q&gt;향후, AI 기반 네트워크, 클라우드, 보안, 콘텐츠 융합 서비스 등 신성장 사업 확대를 통해 통신산업은 인프라 중심에서 디지털 서비스 산업으로의 구조적 성장을 이어갈 전망입니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323001433&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;지금 주가는 앞으로 연 -39% 성장을 가정 — 과거 연 8%&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;[경기변동의 특성 및 계절성]경기활성화 시기에는 기업들의 투자 심리 확대로 인해 컨택센터 서비스 시장이 확대되며, 불경기 시기에는 차별화된 고객관리로 매출 향상을 도모하고 비용절감 수단으로 컨택센터를 활용하기에, 비교적 경기변동에 대한 민감도가 크지 않아 불경기 국면에서도 성장 가능성을 가졌다고 판단됩니다.&lt;/li&gt;&lt;li class=q&gt;[경기변동의 특성 및 계절성]통신서비스는 생활 필수재로서 경기변동에 대한 민감도가 낮은 산업에 속하지만, 경기 침체 시 단말기 교체 주기 지연이나 기업의 ICT 투자 축소로 단기적 영향을 받을 수 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323001433&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 2001년 KT의 114번호안내서비스 사업부문이 분사하여 설립되었으며, 2010년 유가증권시장에 상장됨. 2025년 하반기 금융업종 전문 운영사인 에이치엔씨네트워크를 100% 인수 후 흡수합병하여 금융업종 레퍼런스를 강화함. KT고객센터, 일반컨택센터, 유통사업, 번호안내사업 등을 영위하며, 2025년 매출 기준 KT고객센터 45%, 일반컨택센터 32%, 유통 19%, 번호안내 3%, 기타 1%로 구성됨.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 회사는 컨택센터사업, 유통사업, 번호안내사업 등을 주로 영위하고 있습니다. 세부 사업별 비중은 2025년 매출 기준 KT고객센터사업 45%, 일반컨택센터사업(Open Market) 32%, 유통사업 19%, 번호안내사업 3%, 기타사업 1%로 구성되어있습니다.컨택센터사업은 위수탁사업이 주를 이루고 있으며, KT고객센터, 일반컨택센터사업으로 구성되어 있습니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;사업보고서 매출 표를 재무제표와 맞추지 못해 표는 뺐어요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🩺 기초 체력&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💵&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;최근 1년 한 달에 약 31억 벌었어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏠&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;2년 벌면 회사를 통째로 사요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏦&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;1,000만원이면 배당 월 4.5만원 · 은행 2.6만원 — 은행보다 많아요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💰&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;2025년 한 해로 보면 번 만큼 현금도 들어왔어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📈&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;과거만큼만 커도 지금 주가가 설명돼요 — 기대가 크지 않은 편 — 주가 기대 -39% · 과거 현금 +8%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🧩&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;3년간 그대로예요 — 내 몫이 유지돼요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;밸류 — PER 2.4배(최근 4분기) · PBR 0.32배(최근 분기)&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;이익은 최근 4분기 실제(네이버), 배당은 최근 배당수익률(세전), 은행은 COFIX 신규취급액 3.18%(09/15)&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📐 10년 가격표 — 지금 싼 편일까?&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;이 회사의 지난 10년 PER·PBR 과 비교한 지금 위치 · 싸다고 오른다는 뜻은 아니에요&lt;/p&gt;&lt;div style=&quot;display:grid;grid-templat ;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 엘브이엠씨홀딩스&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 2009년 라오스 소재 사업자회사를 국내 유가증권시장에 상장하기 위해 케이먼제도에서 설립된 역외지주회사임. 라오스, 베트남, 미얀마를 중심으로 CBU 완성차 판매, SKD/CKD 신차 제조 및 판매, 자동차 부품 판매 및 A/S 사업을 영위하고 있음. 현대차·기아차 독점 판매권과 장안·지리자동차 딜러십을 보유하여 라오스 내 유일한 풀라인업 공급자로서 인도차이나 반도 전역으로 사업을 확대하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;■ 상용차 산업 상용차 산업은 일반 소비자가 아닌 기업을 주요 고객으로 하는 B2B 산업으로, 건설 장비 부문을 중심으로 사회간접자본 투자계획·건설경기·기업 설비투자 동향 등에 직접적인 영향을 받습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260428000679&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;(2) 시장 현황 ■ 글로벌 자동차 시장 2025년 글로벌 자동차 시장은 신흥시장 성장 및 공급망 안정화에 힘입어 전년 대비 약 2.4% 증가한 약 9,430만 대 판매가 전망됩니다.&lt;/li&gt;&lt;li class=q&gt;한편 자국 브랜드 VinFast의 급성장(2025년 연간 약 175,000대 전기차 인도 전망)으로 경쟁이 더욱 심화되고 있습니다.&lt;/li&gt;&lt;li class=q&gt;■ 자동차부품 라오스 자동차부품 사업은 지속적인 차량 판매 증가로 누적 구매 대수가 늘어남에 따라 A/S 수요의 꾸준한 성장이 예상됩니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260428000679&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;지금 주가는 앞으로 연 119% 성장을 가정 — 과거 연 18%&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;증권사 리 ;/text&gt;&lt;text x=&quot;220.0&quot; y=&quot;117&quot; font-size=&quot;9&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b95a1&quot;&gt;25.4Q&lt;/text&gt;&lt;rect x=&quot;247.2&quot; y=&quot;18.0&quot; width=&quot;25.6&quot; height=&quot;86.0&quot; rx=&quot;3&quot; fill=&quot;#c9cdd4&quot;/&gt;&lt;text x=&quot;260.0&quot; y=&quot;14.0&quot; font-size=&quot;9&quot; text-anchor=&quot;middle&quot; fill=&quot;#dc2626&quot;&gt;15%&lt;/text&gt;&lt;text x=&quot;260.0&quot; y=&quot;117&quot; font-size=&quot;9&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b95a1&quot;&gt;26.1Q&lt;/text&gt;&lt;rect x=&quot;287.2&quot; y=&quot;33.2&quot; width=&quot;25.6&quot; height=&quot;70.8&quot; rx=&quot;3&quot; fill=&quot;#3a1d96&quot;/&gt;&lt;text x=&quot;300.0&quot; y=&quot;29.2&quot; font-size=&quot;9&quot; text-anchor=&quot;middle&quot; fill=&quot;#dc2626&quot;&gt;17%&lt;/text&gt;&lt;text x=&quot;300.0&quot; y=&quot;117&quot; font-size=&quot;9&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b95a1&quot;&gt;26.2Q&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🧾&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;26.2Q 매출 7,262.1만원 · 영업이익 1,214.2만원&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📈&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;작년 같은 분기보다 매출 +3%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;DART 분기·사업보고서(4분기 = 연간 − 1~3분기)&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🧑‍💼 증권사들은?&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;증권사별 가장 최근 목표가 기준 · 우리는 목표가를 내지 않아요&lt;/p&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;최근 6개월 리포트&lt;/span&gt;&lt;b&gt;1건 · 1곳&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;목표가 중앙값&lt;/span&gt;&lt;b&gt;2,000원 (+68%)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;목표가 범위&lt;/span&gt;&lt;b&gt;2,000 ~ 2,000원&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;의견&lt;/span&gt;&lt;b&gt;매수 1 · 중립 0&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;최근 90일 목표가&lt;/span&gt;&lt;b&gt;상향 0 · 하향 0&lt;/b&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;💡 모든 종목 리포트로 보면 목표가는 6개월 안에 46%만 닿았어요 · &amp;#x27;중립&amp;#x27;은 지수를 29%만 이겨 사실상 매도예요 · 목표가를 올린 리포트가 가장 나았어요(지수 대비 +15%) — 2022년 이후 리포트 4,887건 측정(2026-09-24)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;네이버 리서치 상세(목표가·작성일 주가) + 수정주가 일봉 — analyst_scorecard&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🔄 누가 사고 있나&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🌏&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;외국인 최근 20일 중 3일 샀어요 (60일 중 28일)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏛️&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;기관 최근 20일 중 8일 샀어요 (60일 중 24일)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;키움 투자자별 일별 순매수&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📰 최근 중요한 공시 &amp; 뉴스&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;최근 4달 공시·뉴스 중 주가가 크게 반응한 순서 · 발표일과 다음 날 이틀, 지수 대비&lt;/p&gt;&lt;div style=&quot;padding:8px 0;border-top:1px solid #f2f4f6&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;26.06.08 · 공시 · 전환가 조정&lt;/div&gt;&lt;div style=&quot;font-size:14px;font-weight:700;line-height:1.45&quot;&gt;전환가액ㆍ신주인수권행사가액ㆍ교환가액의조정(안내공시)&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:700;color:#8b95a1&quot;&gt;반응 작음 (+1.3%)&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;DART 공시(정기·절차 제외) + 뉴스 저장소(재료 분류, 제목에 회사 이름) · 반응은 수정주가 일봉&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;⚠️ 체크할 점&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;•&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;지금 주가는 과거보다 더 빨리 커야 설명돼요(기대가 큰 편)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;•&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;외국인이 최근 20일 중 3일만 샀어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;사실 대비만 적어요 — 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div id=&quot;toss&quot;&gt;&lt;section class=&quot;t-card t-dark&quot;&gt;&lt;div class=&quot;t-s&quot; style=&quot;margin:0&quot;&gt;엘브이엠씨홀딩스 · 900140&lt;/div&gt;&lt;div class=&quot;t-px&quot;&gt;1,192원&lt;/div&gt;&lt;div class=&quot;t-hl&quot;&gt;엘브이엠씨홀딩스 — 올해 한 달에 22억 버는 회사. 지금 주가는 회사가 과거보다 더 빨리 커야 설명되는 가격이에요(기대가 큰 편). 증권사가 목표가를 지금의 1.5배 넘게 잡았어요.&lt;/div&gt;&lt;div class=&quot;t-chips&quot;&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#ffffff&quot;&gt;💵 올해 한 달 22억 벌어요&lt;/span&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#fdba74&quot;&gt;🌏 외국인 20일 중 3일만 샀어요&lt;/span&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#ffffff&quot;&gt;🧑‍💼 증권사 목표가 1.5배 넘게&lt;/span&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#6ee7b7&quot;&gt;🏠 9년이면 회사 통째로&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;t-card&quot;&gt;&lt;p class=&quot;t-h&quot;&gt;🏢 무슨 회사?&lt;/p&gt;&lt;p class=&quot;t-a&quot; style=&quot;font-size:14px;font-weight:600;line-height:1.6;color:#333d4b&quot;&gt;동사는 2009년 라오스 소재 사업자회사를 국내 유가증권시장에 상장하기 위해 케이먼제도에서 설립된 역외지주회사임. 라오스, 베트남, 미얀마를 중심으로 CBU 완성차 판매, SKD/CKD 신차 제조 및 판매, 자동차 부품 판매 및 A/S 사업을 영위하고 있음.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;t-card&quot;&gt;&lt;p class=&quot;t-h&quot;&gt;🗓️ 앞으로 확인할 것&lt;/p&gt;&lt;p class=&quot;t-s&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황&lt;/p&gt;&lt;div class=&quot;t-row&quot;&gt;&lt;div class=&quot;t-dot&quot; style=&quot;background:#2563eb;font-size:12px;font-weight:800&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;t-a&quot; style=&quot;font-size:15px&quot;&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/div&gt;&lt;div class=&quot;t-q&quot; style=&quot;color:#8b95a1&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;t-card&quot;&gt;&lt;p class=&quot;t-h&quot;&gt;⚠️ 나빠질 수 있는 것&lt;/p&gt;&lt;p class=&quot;t-s&quot;&gt;증권사 리포트에 적힌 위험 · 우리가 계산한 신호&lt;/p&gt;&lt;div class=&quot;t-row&quot;&gt;&lt;div class=&quot;t-dot&quot; style=&quot;background:#d97706&quot;&gt;!&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;t-a&quot; style=&quot;font-size:15px&quot;&gt;지금 주가는 과거보다 더 빨리 커야 설명돼요 — 실적이 기대에 못 미치면 실망이 커질 수 있어요&lt;/div&gt;&lt;div class=&quot;t-q&quot; style=&quot;color:#8b95a1&quot;&gt;역DCF(우리 계산)&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;t-card&quot;&gt;&lt;p class=&quot;t-h&quot;&gt;📐 10년 중 지금 가격은?&lt;/p&gt;&lt;p class=&quot;t-s&quot;&gt;2016년 이후 이 회사의 PER·PBR 범위에서 지금 위치 · 가운데 눈금이 중앙값&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;t-leg&quot; style=&quot;padding:0&quot;&gt;&lt;b&gt;PBR 569.9배&lt;/b&gt;&lt;span&gt;보통 (54%)&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 320 44&quot; style=&quot;width:100%;height:auto;display:block&quot;&gt;&lt;rect x=&quot;12&quot; y=&quot;16&quot; width=&quot;296&quot; height=&quot;10&quot; rx=&quot;5&quot; fill=&quot;#f2f4f6&quot;/&gt;&lt;rect x=&quot;12.0&quot; y=&quot;16&quot; width=&quot;296.0&quot; height=&quot;10&quot; rx=&quot;5&quot; fill=&quot;#22c55e&quot; opacity=&quot;0.25&quot;/&gt;&lt;rect x=&quot;111.6&quot; y=&quot;12&quot; width=&quot;2&quot; height=&quot;18&quot; fill=&quot;#8b95a1&quot;/&gt;&lt;circle cx=&quot;119.3&quot; cy=&quot;21&quot; r=&quot;7&quot; fill=&quot;#22c55e&quot;/&gt;&lt;text x=&quot;12&quot; y=&quot;42&quot; font-size=&quot;9&quot; fill=&quot;#8b95a1&quot;&gt;싸던 때 202.2&lt;/text&gt;&lt;text x=&quot;308&quot; y=&quot;42&quot; font-size=&quot;9&quot; fill=&quot;#8b95a1&quot; text-anchor=&quot;end&quot;&gt;비싸던 때 1216.9&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;t-leg&quot; style=&quot;padding:0&quot;&gt;&lt;b&gt;PER 97532.0배&lt;/b&gt;&lt;span&gt;보통 (57%)&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 320 44&quot; style=&quot;width:100%;height:auto;display:block&quot;&gt;&lt;rect x=&quot;12&quot; y=&quot;16&quot; width=&quot;296& &lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;에스디바이오센서&lt;small&gt;137310&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;6,260원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;에스디바이오센서 — 최근 1년 한 달에 609억씩 손해 보는 회사. 지금 주가는 회사가 과거보다 더 빨리 커야 설명되는 가격이에요(기대가 큰 편).&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;💵 최근 1년 한 달 609억 손해&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;🛟 장부상 순자산이 회사값보다 221% 많아요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;🏦 배당이 은행 이자보다 많아요 (연 3.2%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;📐 2021년 이후 가장 싼 편 (PBR 하위 3%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;🧩 3년간 주식 +17% — 내 몫이 옅어졌어요&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-10-02 05:57 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 에스디바이오센서&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 2010년 주식회사 에스디의 바이오센서 사업부문을 인적 분할하여 설립된 체외진단 전문기업으로, 2021년 유가증권시장에 상장함. 체외진단(IVD) 분야에서 면역진단, 분자진단, 현장진단(POCT), 임상화학, 자가진단 및 만성질환 관리까지 아우르는 종합 진단 포트폴리오를 보유하고 있음. WHO PQ, CE-IVD, FDA 등 글로벌 인증을 기반으로 100여 개국 이상의 판매 네트워크를 구축하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;기타 제품 — &lt;b&gt;42%&lt;/b&gt; · 2,960억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:42%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;기타 (상품, 용역 등) — &lt;b&gt;23%&lt;/b&gt; · 1,663억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:23%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;면역화학진단 — &lt;b&gt;20%&lt;/b&gt; · 1,404억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:20%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;자가혈당측정 — &lt;b&gt;12%&lt;/b&gt; · 887억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:12%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;ul&gt;&lt;li class=q&gt;최근 1년(25.3Q~26.2Q) 영업손실 647억 — 분기 평균 162억&lt;/li&gt;&lt;li class=q&gt;적자가 줄고 있어요: 최근 두 분기 189억 vs 그 전 두 분기 458억&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · DART 분기 손익 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260318001064&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;3) 의료 분야 트렌드 변화에 따른 특정 영역에 대한 수요 증가 의료 분야 트렌드가 치료 중심에서 예방 중심으로 변화함에 따라 검사의 적정성과 의료비용 최소화가 중요한 부분으로 대두되어 현장진단 검사 및 분자진단 검사에 대한 수요가 크게 증가할 것으로 예상되고 있습니다.&lt;/li&gt;&lt;li class=q&gt;글로벌 체외진단 시장 전 세계 체외진단(IVD) 시장은 2021년 801억 달러에서 연평균 성장률 7%로 증가하여, 2025년에는 1,053억 달러에 이를 것으로 전망됩니다.&lt;/li&gt;&lt;li class=q&gt;Marketsandmarkets에 따르면, 환자의 Self test 시장을 포함한 Point of Care(POC) 검사는 2020년 USD 173억에서 연평균 성장률 5.7%로 증가하여, 2025년에는 USD 228억에 이를 것으로 전망하고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260318001064&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;지금 주가는 앞으로 연 -25% 성장을 가정 — 과거 연 -28%&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;체외진단 산업은 의료 필수재 성격으로 경기 변동 민감도가 낮고, 고령화·감염병 상시화·만성질환 유병률 확대 등 구조적 요인으로 중장기적으로 안정적인 수요가 유지되는 특징이 있습니다.&lt;/li&gt;&lt;li class=q&gt;2. 영업 및 환경 관련 규제사항 당사는 법률에서 정하고 있는 각종 제품환경 규제와 사업장관리 환경규제를 철저하게 준수하고 있으며, 관련 규제사항은 다음과 같습니다.&lt;/li&gt;&lt;li class=q&gt;최근 3년 주식 수 +17% — 같은 이익을 더 많은 주식이 나눠 가져요&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260318001064&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 2010년 주식회사 에스디의 바이오센서 사업부문을 인적 분할하여 설립된 체외진단 전문기업으로, 2021년 유가증권시장에 상장함. 체외진단(IVD) 분야에서 면역진단, 분자진단, 현장진단(POCT), 임상화학, 자가진단 및 만성질환 관리까지 아우르는 종합 진단 포트폴리오를 보유하고 있음. WHO PQ, CE-IVD, FDA 등 글로벌 인증을 기반으로 100여 개국 이상의 판매 네트워크를 구축하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;기타 제품&lt;/span&gt;&lt;b&gt;2,960억 (42%) · 전년 +2%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:42%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;기타 (상품, 용역 등)&lt;/span&gt;&lt;b&gt;1,663억 (23%) · 전년 +12%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:23%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;면역화학진단&lt;/span&gt;&lt;b&gt;1,404억 (20%) · 전년 -6%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:20%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;자가혈당측정&lt;/span&gt;&lt;b&gt;887억 (12%) · 전년 +13%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:12%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;분자진단&lt;/span&gt;&lt;b&gt;193억 (3%) · 전년 -30%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:3%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 당사는 체외진단(IVD) 의료기기 및 시약을 기반으로 감염병과 만성질환 진단 수요에 대응하는 사업을 영위하고 있습니다. 체외진단은 혈액·소변·체액 등 검체를 이용해 인체 외부에서 질병을 진단하며, 조기발견·치료방향 설정·치료효과 모니터링 등 임상 의사결정의 출발점이 되는 핵심 의료 인프라로 기능합니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서 2025 매출 표 — 재무제표 매출과 대조해 맞은 표만 보여 줘요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;⚠️ 나빠질 수 있는 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;지금 주가는 과거보다 더 빨리 커야 설명돼요 — 실적이 기대에 못 미치면 실망이 커질 수 있어요&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;역DCF(우리 계산)&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;최근 1년 적자예요 — 흑자 전환이 늦어지면 돈을 더 구해야 할 수 있어요&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 손익&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트에 적힌 위험과 우리가 계산한 신호&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🩺 기초 체력&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💵&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;최근 1년 한 달에 약 609억씩 손해였어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏦&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;1,000만원이면 배당 월 2.7만원 · 은행 2.6만원 — 은행과 비슷해요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💰&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;2025년 한 해로 보면 번 만큼 현금도 들어왔어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📈&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;과거보다 더 빨리 커야 지금 주가가 설명돼요 — 기대가 큰 편 — 주가 기대 -25% · 과거 현금 -28%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🧩&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;3년간 +17% 늘었어요 — 내 몫이 조금씩 옅어져요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;밸류 — PBR 0.31배(최근 분기)&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;이익은 최근 4분기 실제(네이버), 배당은 최근 배당수익률(세전), 은행은 COFIX 신규취급액 3.18%(09/15)&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📐 10년 가격표 — 지금 싼 편일까?&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;이 회사의 지난 10년 PER·PBR 과 비교한 지금 위치 · 싸다고 오른다는 뜻은 아니에요&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px&quot;&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;1주&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:800;color:#2563eb&quot;&gt;-0.8%&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;1개월&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:800;color:#dc2626&quot;&gt;+2.9%&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;3개월&lt;/div&gt;&lt;div style=&quot function apply(v){b.dataset.view=v;var t=v===&#x27;toss&#x27;;btn.textContent=t?&#x27;일반 보기&#x27;:&#x27;토스 보기&#x27;;
lab.textContent=t?&#x27;토스 보기 · 그림으로&#x27;:&#x27;일반 보기 · 표와 문장&#x27;;}
var q=((function(){try{return parent.location.search}catch(e){return location.search}})().match(/[?&amp;]view=(plain|toss)/)||[])[1];apply(q||&#x27;plain&#x27;);
btn.addEventListener(&#x27;click&#x27;,function(){apply(b.dataset.view===&#x27;toss&#x27;?&#x27;plain&#x27;:&#x27;toss&#x27;);window.scrollTo(0,0);});})();&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section><script>
(function(){
  // 높이는 html·body 의 실제 크기로 잰다 — scrollHeight 는 틀 높이보다 작아지지 않아, 보기를 바꾸거나 접으면
  // 틀이 줄지 않고 빈 공간이 남았다(토스 보기 24,261px 가 37,227px 로).
  function fit(f){try{var d=f.contentDocument;if(!d||!d.body)return;var w=d.defaultView,cs=w.getComputedStyle(d.body);
    var h=Math.max(d.documentElement.getBoundingClientRect().height,
                   d.body.getBoundingClientRect().height+parseFloat(cs.marginTop)+parseFloat(cs.marginBottom));
    f.style.height=Math.ceil(h)+'px';f.style.minHeight='0';}catch(e){}}
  function watch(f){fit(f);try{new ResizeObserver(function(){fit(f);}).observe(f.contentDocument.body);}catch(e){}
    setTimeout(function(){fit(f);},800);}
  var frames=[].slice.call(document.querySelectorAll('iframe.bb-f'));
  // 앞쪽 틀은 이 스크립트가 붙기 전에 로드를 마칠 수 있다 — load 를 놓치면 높이가 안 잡혔다(7종목 중 앞 4개)
  frames.forEach(function(f){f.addEventListener('load',function(){watch(f);});
    try{var d=f.contentDocument;if(d&&d.readyState==='complete'&&d.body&&d.body.childElementCount)watch(f);}catch(e){}});
  var btns=[].slice.call(document.querySelectorAll('.bb-views button'));
  function mark(v){btns.forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v));});}
  var q=(location.search.match(/[?&]view=([a-z]+)/)||[])[1];
  mark(q||(btns[0]&&btns[0].dataset.v));
  btns.forEach(function(b){b.addEventListener('click',function(){var v=b.dataset.v;
    try{history.replaceState(null,'',location.pathname+'?view='+v+location.hash);}catch(e){}
    mark(v);frames.forEach(function(f){f.style.minHeight='100vh';f.srcdoc=f.srcdoc;});});});
})();
