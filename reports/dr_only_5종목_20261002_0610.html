&lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;퓨런티어&lt;small&gt;370090&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;6,150원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;퓨런티어 — 최근 1년 한 달에 4억씩 손해 보는 회사.&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;💵 최근 1년 한 달 4억 손해&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;💰 빚 빼고도 현금 283억 (회사값의 54%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;📐 2022년 이후 가장 싼 편 (PBR 하위 3%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;🌏 외국인 20일 중 5일만 샀어요&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-10-02 06:06 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 퓨런티어&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 2009년 설립된 카메라 모듈 관련 자동화장비 전문 기업으로, 2022년 코스닥시장에 기술성장기업으로 상장하였음. 2018년 부품 개발 및 판매 전문기업인 아이알브이테크를 합병하여 부품사업부를 신설하였음. 자동차 전장용 카메라 조립 및 검사장비를 개발 판매하는 장비사업부와 산업용 PC, 검사용 LED 광원, 자동화 컴포넌트 제품을 개발 판매하는 부품사업부로 구성되어 사업을 영위하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;전장용 장비 — &lt;b&gt;56%&lt;/b&gt; · 68억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:56%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;산업용pc광원등 — &lt;b&gt;41%&lt;/b&gt; · 50억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:41%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;기타 장비 — &lt;b&gt;3%&lt;/b&gt; · 4억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:3%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;ul&gt;&lt;li class=q&gt;최근 1년(25.3Q~26.2Q) 영업손실 56억 — 분기 평균 14억&lt;/li&gt;&lt;li class=q&gt;적자가 줄고 있어요: 최근 두 분기 19억 vs 그 전 두 분기 37억&lt;/li&gt;&lt;li class=q&gt;장비사업부는 2015년부터 삼성전기의 A향과 세코닉스의 E향 전장카메라 제조라인에 Active Align 장비 납품을 시작으로 Dual Align, EOL, Intrinsic Calibration 장비 등의 다양한 조립/검사 공정장비를 납품하고 있으며, 특히 삼성전기와 LG이노텍, Aptiv 등의 9개 전장부품업체에 핵심 공정장비(시제품 포함)를 납품한 실적이 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · DART 분기 손익 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260310002997&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;현재 라이다(LiDAR) 주요 제조사는 약 33개사 이상이며, 시장 성장성이 높아짐에 따라 라이다 신규 제품들의 출현과 함께 신규 제조사들의 증가로 인해 필요한 제조공정장비도 그에 맞추어 증가될 것으로 전망됩니다.&lt;/li&gt;&lt;li class=q&gt;2) 산업용 PC 시장 글로벌 산업용 PC 시장은 시장조시기관 &amp;#x27;Markets and Markets’의 리서치 통계에 따르면 약 44억달러(한화 4조 9천억원) 규모로 추정되며, 연평균 성장률(CAGR) 5.4%로 2025년에는 약 57억달러(한화 7조 225억원) 규모까지 성장할 전망입니다.&lt;/li&gt;&lt;li class=q&gt;시장사업 전망 글로벌 카메라 모듈 시장은 스마트폰, 차량용 ADAS, 드론, 보안 카메라 등 다양한 응용 분야에서 수요가 증가하며 2025년 약 600억 달러 규모로 성장할 것으로 예상됩니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260310002997&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;증권사 추정이 2곳 미만이라 비워 뒀어요&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;및 계절성 ① 장비 사업부 당사는 최전방산업인 ADAS/자율주행 시장과 전방산업인 전장용 카메라 장비 시장의 변동과 밀접한 상관성이 있지만, 최전방 산업의 경기 변동에는 뚜렷한 상관관계를 가지는 요인은 없으며, 계절적인 요인 역시 존재하지 않습니다.&lt;/li&gt;&lt;li class=q&gt;바. 비교우위 사항 (1) 장비사업부 구분 장비분야 경쟁사 당사 경쟁우위 자율주행 센싱카메라 핵심공정 장비 Active Align 국내 이즈미디어 2015년부터 삼성전기의 A사향 센싱카메라 제조라인과 세코닉스의 E사향 뷰잉카메라 제조라인에 지속 공급중이며, 제품의 안정성과 신뢰성을 인정받고 있습니다.&lt;/li&gt;&lt;li class=q&gt;최근 3년 주식 수 +7% — 같은 이익을 더 많은 주식이 나눠 가져요&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260310002997&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 2009년 설립된 카메라 모듈 관련 자동화장비 전문 기업으로, 2022년 코스닥시장에 기술성장기업으로 상장하였음. 2018년 부품 개발 및 판매 전문기업인 아이알브이테크를 합병하여 부품사업부를 신설하였음. 자동차 전장용 카메라 조립 및 검사장비를 개발 판매하는 장비사업부와 산업용 PC, 검사용 LED 광원, 자동화 컴포넌트 제품을 개발 판매하는 부품사업부로 구성되어 사업을 영위하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;전장용 장비&lt;/span&gt;&lt;b&gt;68억 (56%)&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:56%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;산업용pc광원등&lt;/span&gt;&lt;b&gt;50억 (41%)&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:41%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;기타 장비&lt;/span&gt;&lt;b&gt;4억 (3%)&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:3%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 당사는 카메라 모듈 관련 자동화장비 전문 기업으로서 자동차 전장용 카메라 조립 및 검사장비를 개발 판매하는 장비 사업부와, 자동화 공정 장비용 핵심 부품을 개발 판매하는 부품사업부로 구성되어 사업 영위하고 있습니다. 장비사업부는 2015년부터 삼성전기의 A향과 세코닉스의 E향 전장카메라 제조라인에 Active Align 장비 납품을 시작으로 Dual Align, EOL, Intrinsic Calibration 장비 등의 다양한 조립/검사 공정장비를 납품하고 있으&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서 2025 매출 표 — 재무제표 매출과 대조해 맞은 표만 보여 줘요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt; &lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;유에스티&lt;small&gt;263770&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;1,712원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;유에스티 — 최근 1년 한 달에 3억 버는 회사. 지금 주가는 과거만큼만 커도 설명되는 가격이에요(기대가 크지 않은 편).&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;💵 최근 1년 한 달 3억 벌어요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;💰 빚 빼고도 현금 176억 (회사값의 44%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;🛟 장부상 순자산이 회사값보다 109% 많아요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;🏦 배당이 은행 이자보다 많아요 (연 3.5%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;📐 2017년 이후 가장 싼 편 (PBR 하위 3%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;🏭 매출 96%가 대구경 외&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;🌏 외국인 20일 중 0일만 샀어요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;📉 작년 매출 -21%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-10-02 06:06 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 유에스티&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 2009년 미주제강(주)로부터 물적분할되어 설립된 스테인리스 강관 전문 제조업체로, 2017년 코스닥시장에 상장함. 스테인리스 강관의 제작 및 판매를 주요 사업으로 영위하며, 건설, 조선, 해양플랜트, 석유화학, 반도체, 바이오 등 다양한 산업군에 배관용 기초소재를 공급하고 있음. 포항에 3개 공장을 운영하며 배관제품, 고순도 청정관, 정밀관을 생산하고 있으며, 전국 5개 영업점을 통해 지역고객 대응체계를 구축하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;대구경 외 — &lt;b&gt;96%&lt;/b&gt; · 558억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:96%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;기타 — &lt;b&gt;4%&lt;/b&gt; · 22억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:4%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;ul&gt;&lt;li class=q&gt;(2) 산업의 특징 스테인리스 강관의 수요처는 건설, 조선, 해양플랜트, 석유화학, 제지, 자동차부품, 식음료, 반도체, 바이오 등의 구축물 및 제조설비의 배관 등에 분포되어 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323000586&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;국내 대부분의 수요는 KS규격(한국공업규격) 제품이 사용되고 있으며, 플랜트 및 조선 수요는 ASTM규격(미국 재료시험협회규격) 제품이 사용됩니다.&lt;/li&gt;&lt;li class=q&gt;(3) 시장 규모 및 전망스테인리스강관 생산량은 전체규모의 약 2.7% 정도로, 매년 꾸준한 양이 생산되고 있으며, 친환경 산업의 니즈에 따라 꾸준히 탄소강에 대한 교체 수요에 의해서 시장규모가 확대되고 있습니다.&lt;/li&gt;&lt;li class=q&gt;(4) 경기변동 및 계절적 특성 스테인리스 강관은 수요산업군이 다양하고, 기초소재로 사용되고 있어서 경기변동 또는 계절적요인에 의한 수요변동이 적습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323000586&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;지금 주가는 앞으로 연 -22% 성장을 가정 — 과거 연 -8%&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;당사는 경쟁사 대비 다양한 규격의 제품군과 다량의 재고를 운용하고 있습니다.&lt;/li&gt;&lt;li class=q&gt;(나) 영업실적당해년도의 영업은 전년도 대비 매출총액면에서는 20.81% 감소하였고, 영업이익이 전년대비 65.31% 감소하였으며, 순이익은 전년대비 54.55% 감소하였습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323000586&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 2009년 미주제강(주)로부터 물적분할되어 설립된 스테인리스 강관 전문 제조업체로, 2017년 코스닥시장에 상장함. 스테인리스 강관의 제작 및 판매를 주요 사업으로 영위하며, 건설, 조선, 해양플랜트, 석유화학, 반도체, 바이오 등 다양한 산업군에 배관용 기초소재를 공급하고 있음. 포항에 3개 공장을 운영하며 배관제품, 고순도 청정관, 정밀관을 생산하고 있으며, 전국 5개 영업점을 통해 지역고객 대응체계를 구축하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;대구경 외&lt;/span&gt;&lt;b&gt;558억 (96%) · 전년 -21%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:96%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;기타&lt;/span&gt;&lt;b&gt;22억 (4%) · 전년 -21%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:4%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 가. 업계의 현황 (1) 산업의 현황 강관(Steel Pipe)은 단면 형상이 원형 또는 각형으로서 내부가 비어있고 길고 좁은 형체의강재를 말하며, 외경 및 두께에 따라 제품군이 형성됩니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서 2025 매출 표 — 재무제표 매출과 대조해 맞은 표만 보여 줘요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🩺 기초 체력&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💵&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;최근 1년 한 달에 약 3억 벌었어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏠&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;11년 벌면 회사를 통째로 사요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏦&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;1,000만원이면 배당 월 2.9만원 · 은행 2.6만원 — 은행보다 많아요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💰&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;2025년 한 해로 보면 번 만큼 현금도 들어왔어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📈&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;과거만큼만 커도 지금 주가가 설명돼요 — 기대가 크지 않은 편 — 주가 기대 -22% · 과거 현금 -8%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🧩&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;3년간 그대로예요 — 내 몫이 유지돼요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;밸류 — PER 10.8배(최근 4분기) · PBR 0.48배(최근 분기)&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;이익은 최근 4분기 실제(네이버), 배당은 최근 배당수익률(세전), 은행은 COFIX 신규취급액 3.18%(09/15)&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📐 10년 가격표 — 지금 싼 편일까?&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;이 회사의 지난 10년 PER·PBR 과 비교한 지금 위치 · 싸다고 오른다는 뜻은 아니에요&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px&quot;&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;1주&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:800;color:#dc2626&quot;&gt;+1.1%&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;1개월&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:800;color:#dc2626&quot;&gt;+0.8%&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;3개월&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:800;color:#2563eb&quot;&gt;-5.3%&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&q ;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;의견&lt;/span&gt;&lt;b&gt;매수 2 · 중립 0&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;최근 90일 목표가&lt;/span&gt;&lt;b&gt;상향 0 · 하향 0&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;이 종목 목표가 과거 성적&lt;/span&gt;&lt;b&gt;6개월 안 도달 25% (53건)&lt;/b&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;💡 모든 종목 리포트로 보면 목표가는 6개월 안에 46%만 닿았어요 · &amp;#x27;중립&amp;#x27;은 지수를 29%만 이겨 사실상 매도예요 · 목표가를 올린 리포트가 가장 나았어요(지수 대비 +15%) — 2022년 이후 리포트 4,887건 측정(2026-09-24)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;네이버 리서치 상세(목표가·작성일 주가) + 수정주가 일봉 — analyst_scorecard&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🔄 누가 사고 있나&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🌏&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;외국인 최근 20일 중 11일 샀어요 (60일 중 30일)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏛️&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;기관 최근 20일 중 3일 샀어요 (60일 중 22일)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;키움 투자자별 일별 순매수&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📰 최근 중요한 공시 &amp; 뉴스&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;최근 4달 공시·뉴스 중 주가가 크게 반응한 순서 · 발표일과 다음 날 이틀, 지수 대비&lt;/p&gt;&lt;div style=&quot;padding:8px 0;border-top:1px solid #f2f4f6&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;26.06.29 · 공시 · 전환가 조정&lt;/div&gt;&lt;div style=&quot;font-size:14px;font-weight:700;line-height:1.45&quot;&gt;전환가액의조정&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:700;color:#8b95a1&quot;&gt;반응 작음 (+0.0%)&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;DART 공시(정기·절차 제외) + 뉴스 저장소(재료 분류, 제목에 회사 이름) · 반응은 수정주가 일봉&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;⚠️ 체크할 점&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;•&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;주식 수가 3년간 5% 넘게 늘었어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;•&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;작년 순이익이 적자예요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;•&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;이 종목 목표가는 과거 6개월 안에 25%만 닿았어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;사실 대비만 적어요 — 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div id=&quot;toss&quot;&gt;&lt;section class=&quot;t-card t-dark&quot;&gt;&lt;div class=&quot;t-s&quot; style=&quot;margin:0&quot;&gt;천보 · 278280&lt;/div&gt;&lt;div class=&quot;t-px&quot;&gt;36,950원&lt;/div&gt;&lt;div class=&quot;t-hl&quot;&gt;천보 — 올해 한 달에 21억씩 손해 보는 회사. 증권사가 목표가를 지금의 두 배 넘게 잡았어요.&lt;/div&gt;&lt;div class=&quot;t-chips&quot;&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#fdba74&quot;&gt;💵 올해 한 달 21억 손해&lt;/span&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#6ee7b7&quot;&gt;📐 2019년 이후 가장 싼 편 (PBR 하위 4%)&lt;/span&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#6ee7b7&quot;&gt;🛟 장부상 순자산이 회사값보다 12% 많아요&lt;/span&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#fdba74&quot;&gt;🧩 3년간 주식 +17% — 내 몫이 옅어졌어요&lt;/span&gt;&lt;span class=&quot;t-chip&quot; style=&quot;color:#ffffff&quot;&gt;🧑‍💼 증권사 목표가 두 배 넘게&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;t-card&quot;&gt;&lt;p class=&quot;t-h&quot;&gt;🏢 무슨 회사?&lt;/p&gt;&lt;p class=&quot;t-a&quot; style=&quot;font-size:14px;font-weight:600;line-height:1.6;color:#333d4b&quot;&gt;동사는 2007년 설립되어 2019년 코스닥시장에 상장된 중견기업으로, 종속회사 3개사를 보유하고 있음. 전자소재(LCD식각액첨가제, OLED소재, 반도체공정소재), 2차전지소재(전해질, 전해액첨가제), 의약품소재(의약품중간체), 정밀화학소재 사업을 영위하고 있음.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;t-card&quot;&gt;&lt;p class=&quot;t-h&quot;&gt;🏭 무엇으로 버나&lt;/p&gt;&lt;p class=&quot;t-s&quot;&gt;2025년 매출 1,338억 · 사업보고서&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;svg viewBox=&quot;0 0 120 120&quot; width=&quot;120&quot; height=&quot;120&quot;&gt;&lt; &lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;신도리코&lt;small&gt;029530&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;38,800원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;신도리코 — 최근 1년 한 달에 1억씩 손해 보는 회사. 지금 주가는 과거만큼 크는 걸 전제로 한 가격이에요.&lt;/div&gt;&lt;div class=&quot;src&quot; style=&quot;margin-top:6px&quot;&gt;💡 영업은 최근 1년 13억 적자예요 — 순이익이 +387억 흑자인 건 26.1Q 영업 밖 이익(순이익 +194억) 때문이라 &amp;#x27;버는 돈&amp;#x27; 으로 보지 않았어요.&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;💵 최근 1년 한 달 1억 손해&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;💰 빚 빼고 현금만 4,154억 — 회사값보다 많아요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;🛟 장부상 순자산이 회사값보다 230% 많아요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;📐 2016년 이후 가장 싼 편 (PBR 하위 14%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;🌏 외국인 20일 중 0일만 샀어요&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-10-02 06:08 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 신도리코&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 1960년 신도교역 주식회사로 설립되어 1996년 유가증권시장에 상장한 중견기업으로, 국내에 복사기와 팩시밀리를 최초로 소개하며 사무기기 업계를 선도해온 기업임. 현재 15개의 비상장 계열회사를 보유하고 있으며, 국내 9개사와 해외 5개사로 구성되어 있음. Digital과 Network의 미래형 오피스를 구축하는 토털 비즈니스 솔루션 전문기업으로서 복합기, 프린터, 소모품 등 OA기기 제조/판매업을 주력으로 영위하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;소모품및 기타 — &lt;b&gt;50%&lt;/b&gt; · 646억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:50%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;기타 — &lt;b&gt;42%&lt;/b&gt; · 548억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:42%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;임대 — &lt;b&gt;6%&lt;/b&gt; · 77억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:6%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;overflow-wrap:anywhere&quot;&gt;프린터 — &lt;b&gt;2%&lt;/b&gt; · 21억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:2%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;ul&gt;&lt;li class=q&gt;최근 1년(25.3Q~26.2Q) 영업손실 13억 — 분기 평균 3억&lt;/li&gt;&lt;li class=q&gt;적자가 늘고 있어요: 최근 두 분기 59억 vs 그 전 두 분기 -46억&lt;/li&gt;&lt;li class=q&gt;IT 기술의 발달을 통해 단순 출력 시장에서 솔루션을 통한 회사내 문서 관련 솔루션이 발전하기 시작하였고 고객사의 출력 관리의 효율과 비용 절감 그리고 생산성 향상은 물론 문서 보안 솔루션으로 단순 문서 출력에서 IT 비즈니스로 사업이 확대되었습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · DART 분기 손익 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260311003722&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;2) 국내에 복사기, 팩시밀리를 최초로 소개하고 사무기기 업계를 이끌어온 당사는 국내 최대의 Output Product 전문회사로 성장·발전하였습니다.&lt;/li&gt;&lt;li class=q&gt;사무환경 개선과 사무자동화 추세로 고급기 및 주변기기의 장착율 증가와 Color 시장이 확대되고 있습니다.&lt;/li&gt;&lt;li class=q&gt;구분 내용 복합기 정보산업 디지털화, 복합 다기능화, 보안 솔루션 제공을 통해 다양한 정보 공유, 편집을 가능하게 하는 Network 기반의 시스템기기로 발전할 것으로 전망됩니다 광학기기산업 카메라의 원리, 렌즈등으로 구성된 정밀광학제품으로 광학의 원리를 응용한 광학기기 산업입니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260311003722&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;지금 주가는 앞으로 연 -9% 성장을 가정 — 과거 연 -5%&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;(2) 시장점유율 해외 전문 Maker의 국내 업체와의 유통망 컨소시엄을 구성한 진출이 활발하게 진행되고 있으며, 국내 복합기 및 프린터 고유의 시장 영역은 IT Solution 발전에 의해 경계가 무너짐에 따라 업체간 경쟁도 심화되고 있는 상황입니다.&lt;/li&gt;&lt;li class=q&gt;제품 Line-up 강화를 토대로 한 경쟁 가속화는 지속될 것으로 예상 됩니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260311003722&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 1960년 신도교역 주식회사로 설립되어 1996년 유가증권시장에 상장한 중견기업으로, 국내에 복사기와 팩시밀리를 최초로 소개하며 사무기기 업계를 선도해온 기업임. 현재 15개의 비상장 계열회사를 보유하고 있으며, 국내 9개사와 해외 5개사로 구성되어 있음. Digital과 Network의 미래형 오피스를 구축하는 토털 비즈니스 솔루션 전문기업으로서 복합기, 프린터, 소모품 등 OA기기 제조/판매업을 주력으로 영위하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;소모품및 기타&lt;/span&gt;&lt;b&gt;646억 (50%) · 전년 -7%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:50%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;기타&lt;/span&gt;&lt;b&gt;548억 (42%) · 전년 -16%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:42%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;임대&lt;/span&gt;&lt;b&gt;77억 (6%) · 전년 +4%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:6%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;프린터&lt;/span&gt;&lt;b&gt;21억 (2%) · 전년 -40%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:2%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;MFP&lt;/span&gt;&lt;b&gt;11억 (1%) · 전년 -82%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:1%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — (1) 영업개황 및 사업부문의 구분 가. 영업개황 1) 당사는 Digital과 Network의 미래형 오피스를 구축하는 토털 비즈니스 솔루션 전문기업으로서, 당사의 주요사업내용으로는 복합기, 프린터 등 OA기기 및 각종 현상약, 전자복사기용 드럼 등 OA기기 관련 소모품을 제조/판매하고 있습니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서 2025 매출 표 — 재무제표 매출과 대조해 맞은 표만 보여 줘요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🚢&lt;/span&gt;&lt;div&gt;&lt;b&gt;수주 소식 — 최근 90일 1건&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;가장 최근 09/27 캐논코리아, 중수청에 프린터·복사기 대규모 공급…5파전 뚫고 수주&lt;/div&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;뉴스·공시 저장소&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;⚠️ 나빠질 수 있는 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;최근 1년 적자예요 — 흑자 전환이 늦어지면 돈을 더 구해야 할 수 있어요&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 손익&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트에 적힌 위험과 우리가 계산한 신호&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🩺 기초 체력&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💵&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;최근 1년 한 달에 약 1억씩 손해였어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏦&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;1,000만원이면 배당 월 2.1만원 · 은행 2.6만원 — 은행보다 적어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💰&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;2025년 한 해로 보면 번 만큼 현금도 들어왔어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📈&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;과거만큼 크는 걸 전제로 한 주가예요 — 주가 기대 -9% · 과거 현금 -6%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🧩&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;3년간 -1% 줄었어요 — 회사가 주식을 거둬들여 내 몫이 커졌어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;밸류 — PER 9.9배(최근 4분기) · PBR 0.30배(최근 분기)&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;이익은 최근 4분기 실제(네이버), 배당은 최근 배당수익률(세전), 은행은 COFIX 신규취급액 3.18%(09/15)&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📐 10년 가격표 — 지금 싼 편일까?&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;이 회사의 지난 10년 PER·PBR 과 비교한 지금 위치 · 싸다고 오른다는 뜻은 아니에요&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px&quot;&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;1주&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:800;color:#2563eb&quot;&gt;-0.9%&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;1개월&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:800;color:#2563eb&quot;&gt;-4.6%&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;min-wi &lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;미래컴퍼니&lt;small&gt;049950&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;11,370원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;미래컴퍼니 — 최근 1년 한 달에 1억씩 손해 보는 회사. 최근 분기(26.2Q) 매출은 작년 같은 분기의 4.4배예요.&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;💵 최근 1년 한 달 1억 손해&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;🛟 장부상 순자산이 회사값보다 30% 많아요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;📐 2016년 이후 가장 싼 편 (PBR 하위 2%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;💰 빚 빼고도 현금 252억 (회사값의 28%)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-10-02 06:09 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 미래컴퍼니&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 1984년 설립되어 반도체 및 디스플레이 제조장비를 주력으로 하며, 2026년 리젠트파트너스를 종속회사로 편입해 금융업으로 확장함. 자회사 미래디피를 통해 터치패널 제조판매를 진행하고 있으며, Edge Grinder는 글로벌 최고 수준의 기술력을 보유하고 있음. 정밀 연삭 가공 기술로 반도체, 이차전지 등 이종산업으로 확장하며 ToF 3D 카메라, 복강경 수술로봇 등 포트폴리오 다각화를 추진하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;최근 1년(25.3Q~26.2Q) 영업손실 54억 — 분기 평균 14억&lt;/li&gt;&lt;li class=q&gt;적자가 줄고 있어요: 최근 두 분기 -57억 vs 그 전 두 분기 112억&lt;/li&gt;&lt;li class=q&gt;최근 디스플레이 분야는 Flexible Display, Ultra Thin Glass, Mini-LED, Micro-LED, QD-OLED, WOLED 등과 같이 기술혁신이 이루어지고 있는 상황으로 당사는 모든 혁신 분야에서 고객사와 긴밀한 협력 관계를 구축하고 기술 개발에 집중하고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · DART 분기 손익 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260320001141&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;Omdia의 2025년 11월 &amp;#x27;디스플레이 장기 수요 예측 추적 보고서&amp;#x27;에 따르면 2026년 전세계 디스플레이 면적 수요가 전년 대비 6% 성장할 전망으로, OLED TV로의 전환과 IT기기의 OLED 패널 채택 증가가 장비 투자 확대를 견인할 것으로 예상됩니다.&lt;/li&gt;&lt;li class=q&gt;2025년부터 2027년까지 70~80억 달러 수준을 안정적으로 유지할 전망이며, IT OLED 설비 투자는 2028년까지 연평균 46% 증가, OLED 전체 비중은 2027년 52%로 확대될 것으로 예측됩니다.&lt;/li&gt;&lt;li class=q&gt;또한 AI, 모빌리티 등 신성장 산업에서 반도체 수요가 지속적으로 확대되어 2026년까지 첨단 공정 및 패키징 장비 부문의 성장세가 뚜렷하게 이어질 것으로 전망하고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260320001141&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;증권사 추정이 2곳 미만이라 비워 뒀어요&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;당사의 2025년 연결 매출은 409억 원으로 전년 동기 대비 약 39% 감소하였으며, 연간 영업손실 247억 원, 연결 당기순손실 250억 원을 기록하였습니다.&lt;/li&gt;&lt;li class=q&gt;패널 제조업체의 투자 스케줄에 따라 직접적인 매출관계를 가지고 있으며 일반 경기변동과는 간접적인 관계에 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260320001141&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 1984년 설립되어 반도체 및 디스플레이 제조장비를 주력으로 하며, 2026년 리젠트파트너스를 종속회사로 편입해 금융업으로 확장함. 자회사 미래디피를 통해 터치패널 제조판매를 진행하고 있으며, Edge Grinder는 글로벌 최고 수준의 기술력을 보유하고 있음. 정밀 연삭 가공 기술로 반도체, 이차전지 등 이종산업으로 확장하며 ToF 3D 카메라, 복강경 수술로봇 등 포트폴리오 다각화를 추진하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 당사는 1984년도에 설립되어 반도체, 디스플레이 패널 제조 장비 연구 개발 및 제조하는 사업 등을 영위하고 있습니다. 자회사 미래디피를 통해 Touch 패널을 제조 판매하는 사업을 전개하고 있습니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;사업보고서 매출 표를 재무제표와 맞추지 못해 표는 뺐어요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;⚠️ 나빠질 수 있는 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;최근 1년 적자예요 — 흑자 전환이 늦어지면 돈을 더 구해야 할 수 있어요&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 손익&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트에 적힌 위험과 우리가 계산한 신호&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🩺 기초 체력&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💵&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;최근 1년 한 달에 약 1억씩 손해였어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💰&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;2025년 한 해로 보면 번 만큼 현금도 들어왔어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🧩&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;3년간 +3% 늘었어요 — 내 몫이 조금씩 옅어져요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;밸류 — PBR 0.83배(최근 분기)&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;이익은 최근 4분기 실제(네이버), 배당은 최근 배당수익률(세전), 은행은 COFIX 신규취급액 3.18%(09/15)&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📐 10년 가격표 — 지금 싼 편일까?&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;이 회사의 지난 10년 PER·PBR 과 비교한 지금 위치 · 싸다고 오른다는 뜻은 아니에요&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px&quot;&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=&quot;font-size:12px;color:#8b95a1&quot;&gt;1주&lt;/div&gt;&lt;div style=&quot;font-size:13px;font-weight:800;color:#dc2626&quot;&gt;+0.5%&lt;/div&gt;&lt;/div&gt;&lt;div style=&qu (function(){
  // 높이는 html·body 의 실제 크기로 잰다 — scrollHeight 는 틀 높이보다 작아지지 않아, 보기를 바꾸거나 접으면
  // 틀이 줄지 않고 빈 공간이 남았다(토스 보기 24,261px 가 37,227px 로).
  function fit(f){try{var d=f.contentDocument;if(!d||!d.body)return;var w=d.defaultView,cs=w.getComputedStyle(d.body);

  var frames=[].slice.call(document.querySelectorAll('iframe.bb-f'));

})();
