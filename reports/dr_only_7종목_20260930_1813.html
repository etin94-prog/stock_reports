&lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;한화엔진&lt;small&gt;082740&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;49,250원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;한화엔진 — 올해 한 달에 160억 버는 회사. 지금 주가는 과거만큼만 커도 설명되는 가격이에요(기대가 크지 않은 편). 대부분의 증권사가 목표가를 지금의 두 배 가까이 잡았어요.&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;💵 올해 한 달 160억 벌어요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;📈 작년 매출 +1370933%&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;📉 올해 이익 -34% 줄 전망&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;🧩 3년간 주식 +17% — 내 몫이 옅어졌어요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;🏭 매출 100%가 -&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;🧑‍💼 증권사 다수 목표가 두 배 가까이&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;💸 부채가 자기 돈의 2.3배지만 빌린 돈은 적어요&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-09-30 18:11 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 한화엔진&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;1999년에 세워져 2011년 유가증권시장에 상장된 회사예요. 큰 배에 들어가는 엔진을 만드는 종합 엔진메이커이고, 선박엔진과 SCR, AM, 디젤발전, 선박용 ESS, 친환경 선박 전력·추진 시스템 통합 사업을 하고 있어요. 2026년에는 노르웨이 SEAM AS 외 3개사를 인수해서 전기 하이브리드 추진 시스템과 전력 관리 역량을 갖추고, 중국에 현지 법인도 세웠어요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;자동 해설(deepseek:deepseek-chat) · 숫자는 원본과 대조 통과 · 2026-09-30&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;p&gt;- &lt;b&gt;100%&lt;/b&gt; · 1.2조&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:100%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;풍부한 생산 경험을 바탕으로 여러 고객의 요구와 엄격한 환경규제에 미리 대응하면서 돈을 벌어요. 사업부문 매출은 한 가지로만 잡혀 있고, 그 금액이 전체 매출의 전부로 표시돼 있어요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;자동 해설(deepseek:deepseek-chat) · 숫자는 원본과 대조 통과 · 2026-09-30 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260318000939&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;2024년에 &amp;#x27;부품판매사업&amp;#x27;이 &amp;#x27;AM사업&amp;#x27;으로 이름이 바뀌었어요.&lt;/li&gt;&lt;li&gt;2025년에는 &amp;#x27;세계 2위 유지&amp;#x27;라는 표현 대신 &amp;#x27;대형 상선 저속엔진 점유율 향상&amp;#x27;을 위해 노력한다고 바뀌었어요.&lt;/li&gt;&lt;li&gt;선박엔진 및 SCR 매출 비중이 2023년 85.6%에서 2025년 88.4%로 커졌어요.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서 2023·2024·2025 사업 개요 비교(자동 요약 deepseek:deepseek-chat · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;p&gt;신흥국을 중심으로 전력 수요가 계속 늘어서 디젤발전 수요가 이어질 것으로 예상돼요. 또 국제해사기구의 환경규제 강화와 탄소중립을 위한 LNG·메탄올·암모니아 같은 친환경 연료 추진 선박 발주, 노후선 교체 수요가 꾸준할 것으로 보고 있어요. 홍해사태 장기화와 항만 혼잡으로 컨테이너선 발주가 늘었고, LNG 개발 프로젝트 가동으로 LNG 운반선 수요도 회복되고 있어요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;자동 해설(deepseek:deepseek-chat) · 숫자는 원본과 대조 통과 · 2026-09-30 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260318000939&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;p class=&quot;q&quot; style=&quot;margin-top:10px&quot;&gt;&lt;b&gt;증권사들은 이렇게 봐요&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;SK증권&lt;/b&gt; 09/17 — 한화엔진은 한화그룹 계열사가 미국 데이터센터에 필요한 발전 엔진 수요를 확실하게 맡아줘서, 아직 실적 기록이 없어도 안정적으로 일감을 받을 수 있는 상황이에요. 또 배를 만드는 데 쓰는 엔진 말고도 데이터센터용 엔진 쪽에서 새 일감이 늘어날 가능성이 큰데, 주가는 아직 이걸 제대로 반영하지 못하고 있다는 게 이 증권사의 핵심 생각이에요.&lt;/li&gt;&lt;li&gt;&lt;b&gt;유안타증권&lt;/b&gt; 08/25 — 이 회사는 배를 움직이는 엔진을 만드는 본업이 잘 되고 있고, 앞으로 데이터센터에 전기를 공급하는 발전용 엔진 사업에도 새로 나갈 가능성이 높아서 좋게 보고 있어요. 또 한화그룹 안에서 북미 발전 사업을 이끌 상장사가 이 회사뿐이라서, 그룹 사업이 커질수록 이 회사의 가치도 함께 올라갈 수 있다고 기대하고 있어요.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 본문 요약(자동) · 숫자는 원문 대조 · 의견·목표가는 뺐어요&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;p&gt;증권사 리포트 추정 표에서는 2026년 매출이 2025년 대비 늘고, 2027년에는 더 크게 늘 것으로 봐요. 다만 지금 주가는 앞으로 연 2% 성장을 가정하고 있는데, 과거에는 연 52% 성장을 했어요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;자동 해설(deepseek:deepseek-chat) · 숫자는 원본과 대조 통과 · 2026-09-30&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;p&gt;선박엔진사업은 조선산업 시장환경과 밀접해서 세계 경기변동, 원자재 가격, 환율 변동 같은 거시경제 변수에 따라 시황이 흔들려요. 2008년 금융위기, 2011년 그리스 재정위기, 2016년 질소산화물 배출규제 발효에 따른 조기 발주, 2020년 COVID-19 등으로 글로벌 경기 침체와 조선·해운산업 발주 감소가 있었어요. 또 최근 3년간 주식 수가 늘어서 같은 이익을 더 많은 주식이 나눠 가진다는 점도 살펴야 해요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;자동 해설(deepseek:deepseek-chat) · 숫자는 원본과 대조 통과 · 2026-09-30 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260318000939&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 1999년 설립된 대형 선박 엔진 제작 중심의 종합 엔진메이커로, 2011년 유가증권시장에 상장됨. 2026년 노르웨이 SEAM AS 외 3개사 인수로 전기 하이브리드 추진 시스템 및 전력 관리 솔루션 역량을 확보하고, 중국에 한화발동기기술상해유한공사를 설립하여 현지 영업 및 기술 지원 체계를 구축함. 선박엔진, SCR, AM, 디젤발전, 선박용 ESS, 친환경 선박 전력·추진 시스템 통합(SI) 사업 영위함.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;-&lt;/span&gt;&lt;b&gt;1.2조 (100%) · 전년 +1370933%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:100%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 가. 사업의 개요당사는 조선 산업의 핵심 기자재인 대형 선박용 엔진 제작을 중심으로 엔진 부품의 판매와 서비스를 제공하고 있으며, 디젤엔진을 이용한 발전시설을 공급하는 종합 엔진메이커입니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서 2025 매출 표 — 재무제표 매출과 대조해 맞은 표만 보여 줘요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🚢&lt;/span&gt;&lt;div&gt;&lt;b&gt;수주 소식 — 최근 90일 13건&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;가장 최근 09/17 수주 실적·사업 다변화 부각 … 주춤했던 조선株 상승세&lt;/div&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;뉴스·공시 저장소&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🔎&lt;/span&gt;&lt;div&gt;&lt;b&gt;Everllence(구 MAN E&amp;amp;S)와 4행정 중속엔진 면허 생산 계약이 체결되는지 지켜봐요.&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;SK증권 리포트&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🔎&lt;/span&gt;&lt;div&gt;&lt;b&gt;한화오션이 공개한 부유식 데이터센터(FDC)의 발전원으로 같은 중속 가스엔진이 납품되는지 확인해요.&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;SK증권 리포트&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🔎&lt;/span&gt;&lt;div&gt;&lt;b&gt;Everllence의 발전엔진 핵심 OEM(주문자상표부착생산) 파트너로 선정되는지 확인해요.&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;유안타증권 리포트&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🔎&lt;/span&gt;&lt;div&gt;&lt;b&gt;2027년 중속엔진 생산 슬롯 중 남는 부분이 데이터센터용 엔진으로 채워지는지 지켜봐요.&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;2027년&lt;/div&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;SK증권 리포트&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🔎&lt;/span&gt;&lt;div&gt;&lt;b&gt;한화에너지가 담당하는 북미 데이터센터용 발전 엔진 납품이 실제로 시작되는지 봐요.&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;2028년&lt;/div&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;SK증권 리포트&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인 · 리포트 항목은 자동 요약(deepseek:deepseek-chat) · 숫자는 원문 대조&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;⚠️ 나빠질 수 있는 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;라이센시(기술 사용 허가를 받은 회사)라서 로열티를 떼고 남는 마진율이 낮을 수 있어요.&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;SK증권 리포트&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;돈이 많이 되는 운영·유지보수 서비스를 Everllence가 직접 맡을 가능성이 높아요.&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;SK증권 리포트&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;Bain Capital의 인수 건 때문에 Everllence가 육상 발전용 중속엔진 시장 확장에 소극적일 수 있어요.&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;유안타증권 리포트&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;중속엔진 사업이 경쟁사보다 열위로 평가받아 왔어요.&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;유안타증권 리포트&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트에 적힌 위험과 우리가 계산한 신호 · 리포트 항목은 자동 요약(deepseek:deepseek-chat) · 숫자는 원문 대조&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🩺 기초 체력&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💵&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;올해 한 달 약 160억 벌 전망 · 최근 1년 242억&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏠&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;21년 벌면 회사를 통째로 사요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💰&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;번 만큼 현금도 들어왔어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📈&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;과거만큼만 커도 지금 주가가 설명돼요 — 기대가 크지 않은 편 — 주가 기대 +2% · 과거 현금 +52%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🧩&lt;/span&gt;&lt;b style=&quot;color:#d97706&quot;&gt;3년간 +17% 늘었어요 — 내 몫이 조금씩 옅어져요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;밸류 — PER 18.8배 · PBR 6.32배&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;이익은 올해 증권사 예상(네이버·FnGuide 컨센서스)과 최근 4분기 실제, 배당은 최근 배당수익률(세전), 은행은 COFIX 신규취급액 3.18%(09/15)&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📐 10년 가격표 — 지금 싼 편일까? &lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;제주반도체&lt;small&gt;080220&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;78,300원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;제주반도체 — 최근 1년 한 달에 217억 버는 회사. 지금 주가는 회사가 과거보다 더 빨리 커야 설명되는 가격이에요(기대가 큰 편).&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;💵 최근 1년 한 달 217억 벌어요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;📈 작년 매출 +89%&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;📐 2016년 이후 가장 비싼 편 (PBR 상위 7%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;🏠 10년이면 회사 통째로&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-09-30 18:11 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 제주반도체&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 2000년 반도체 및 정보통신 제품 설계·제조·판매를 목적으로 설립되었으며, 2005년 코스닥에 상장됨. 모바일 응용기기에 적용하는 메모리 반도체를 개발하는 팹리스 회사로, 자체 생산라인 없이 설계한 제품을 전문 파운드리에 위탁 생산하고 있음. 주력 제품 낸드 MCP는 자사 개발 LPDRAM과 타사 낸드 플래시를 결합한 형태로, 다양한 산업에 공급하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;p&gt;Nand MCP,DRAM, CRAM 등 &lt;b&gt;77%&lt;/b&gt; · 2,339억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:77%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;IC 등 &lt;b&gt;23%&lt;/b&gt; · 701억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:23%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;ul&gt;&lt;li class=q&gt;반도체 수요처별 수요 증감   반도체 수요처별 수요 증감 전망 또 하나의 리스크는 공급망 집중도입니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323001029&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;(1) 반도체 시장의 현황과 전망 2025년도 글로벌 반도체시장은 AI 중심의 수요 확대를 기반으로 단순한 사이클 회복을 뛰어넘어 PC, 모바일 시대에서 AI시대로의 구조적 성장 국면에 돌입한 한 해였습니다.&lt;/li&gt;&lt;li class=q&gt;지난해 하반기부터 주요 생산 업체의 감산 정책이 효과가 발휘되고 있고, AI시장의 성장으로 고용량 제품의 수요가 아직 견고하며, 스마트폰, PC등 IT 전방 수요의 증가로 인하여 2025년 3분기부터 본격적인 AI용 선단 반도체 제품들에 대한 수요를 바탕으로 초과수요로 전환될 전망입니다.&lt;/li&gt;&lt;li class=q&gt;2026년 NAND 비트 수요는 전년대비 약 22% 증가한 1,126억GB로, 조정 수요는 1,132억GB에 이를 전망이며, DRAM과 마찬가지로 수요 성장은 하이퍼스케일러의 AI 투자가 핵심적으로 작용할 것으로 보입니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323001029&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;지금 주가는 앞으로 연 32% 성장을 가정 — 과거 연 24%&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;2025년도 글로벌 반도체 생산 업체 매출액(출처   2025년도 글로벌 반도체 생산 업체 매출액(출처 : gartner) 다만 2025년 반도체 시장은 AI에 편중되어 성장하였고, 비AI시장은 상대적으로 약세였던 점이 향후 반도체 시장의 리스크로 남아 있습니다.&lt;/li&gt;&lt;li class=q&gt;(가) 제품의 시장경쟁력 ① 경기변동의 영향연결회사 제품의 경기변동 영향 정도는 전방산업인 모바일 응용기기, IoT 장치 관련 시장으로부터 영향을 받을 수 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323001029&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 2000년 반도체 및 정보통신 제품 설계·제조·판매를 목적으로 설립되었으며, 2005년 코스닥에 상장됨. 모바일 응용기기에 적용하는 메모리 반도체를 개발하는 팹리스 회사로, 자체 생산라인 없이 설계한 제품을 전문 파운드리에 위탁 생산하고 있음. 주력 제품 낸드 MCP는 자사 개발 LPDRAM과 타사 낸드 플래시를 결합한 형태로, 다양한 산업에 공급하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;Nand MCP,DRAM, CRAM 등&lt;/span&gt;&lt;b&gt;2,339억 (77%) · 전년 +47%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:77%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;IC 등&lt;/span&gt;&lt;b&gt;701억 (23%) · 전년 +4123%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:23%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; style=&quot;border:0;padding:4px 0 0&quot;&gt;&lt;span&gt;Fail 자재, Skeleton WF 등&lt;/span&gt;&lt;b&gt;2,500.0만원 (0%) · 전년 -79%&lt;/b&gt;&lt;/div&gt;&lt;div style=&quot;height:8px;border-radius:999px;background:#f2f4f6;margin:3px 0 6px;overflow:hidden&quot;&gt;&lt;i style=&quot;display:block;height:100%;width:0%;background:#3a1d96;border-radius:999px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — (1) 반도체 시장의 현황과 전망 2025년도 글로벌 반도체시장은 AI 중심의 수요 확대를 기반으로 단순한 사이클 회복을 뛰어넘어 PC, 모바일 시대에서 AI시대로의 구조적 성장 국면에 돌입한 한 해였습니다. SIA 및 Gartner에 따르면 2025년 연간 반도체 판매액은 약 8,000억 달러에 육박한다고 발표하였습니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서 2025 매출 표 — 재무제표 매출과 대조해 맞은 표만 보여 줘요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;⚠️ 나빠질 수 있는 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;▼&lt;/span&gt;&lt;div&gt;&lt;b style=&quot;color:#d97706&quot;&gt;지금 주가는 과거보다 더 빨리 커야 설명돼요 — 실적이 기대에 못 미치면 실망이 커질 수 있어요&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot &lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;코리아써키트&lt;small&gt;007810&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;74,400원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;코리아써키트 — 올해 한 달에 78억 버는 회사.&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;💵 올해 한 달 78억 벌어요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#d97706&quot;&gt;📐 2016년 이후 가장 비싼 편 (PBR 상위 4%)&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;🏠 19년이면 회사 통째로&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-09-30 18:12 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 코리아써키트&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 1972년 PCB 제조·판매를 목적으로 설립되었으며, 1985년 상장하였고, 테라닉스, 인터플렉스, 시그네틱스를 보유하고 있음. 테라닉스의 PCB 부문을 2026년에 흡수합병하여 사업 구조를 개편하였음. 스마트폰용 HDI와 메모리 모듈 제품을 Top 기업에 공급하며, 통신기기 중심 HDI와 반도체 중심 Package Substrate 부문으로 운영하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;PCB 산업은 고객이 설계한 제품을 주문받아 생산하는 수주산업으로 납기준수와 고품질이 요구되는 고객지향적 산업입니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260319000865&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;또한 아시아, 남미, 아프리카 등의 이머징 마켓의 성장과 함께 전방산업의 수요 또한 증가함에 따라 PCB산업도 지속적인 성장이 예상됩니다.&lt;/li&gt;&lt;li class=q&gt;NAND Base SSD의 경우, 클라이언트향 SSD 시장 확대는 다소 더디게 진행되고 있으나, AI Server 수요 증가에 따라 기업향 고성능, 대용량 SSD(EDSFF)의 본격적인 성장이 예상됩니다.&lt;/li&gt;&lt;li class=q&gt;특히 당사 핵심기술인 고방열기판 기술을 기반으로 국내외 고객사와 신규제품에 대한 선행제품 개발을 확대하였고 미래 성장동력인 전장 및 통신 산업분야의 신규 고객 확보로향후 당사 매출성장은 지속 확대될 것으로 판단하고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260319000865&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;증권사 추정이 2곳 미만이라 비워 뒀어요&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;반도체 산업의 순환 사이클을 살펴보면, 대개 PC경기 둔화로 Micro processor 시장이 축소되면 D램 시장의 경우 Logic, Micro component시장에 비해 변동폭이 큰 관계로 전체 반도체 시장 경기를 좌우하는 지표가 되고 있습니다.&lt;/li&gt;&lt;li class=q&gt;또한 기술적인 부분 이외에 작년부터 이어지는 원자재 공급난에 대한 대응이 매우 중요하게 되었으며 향후 2~3년간은 원자재의 원활한 확보 여부가 사업에 큰 영향을 미칠 수 있어 이에 대한 다양한 대안을 모색하고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260319000865&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 1972년 PCB 제조·판매를 목적으로 설립되었으며, 1985년 상장하였고, 테라닉스, 인터플렉스, 시그네틱스를 보유하고 있음. 테라닉스의 PCB 부문을 2026년에 흡수합병하여 사업 구조를 개편하였음. 스마트폰용 HDI와 메모리 모듈 제품을 Top 기업에 공급하며, 통신기기 중심 HDI와 반도체 중심 Package Substrate 부문으로 운영하고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 지배회사인 당사는 PCB를 제조, 판매하는 사업을 영위하고 있습니다. 또한 국내 종속기업 중 테라닉스는 특수 PCB를, 인터플렉스는 FPCB를, 시그네틱스는 반도체 패키징업을 영위하고 있습니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;사업보고서 매출 표를 재무제표와 맞추지 못해 표는 뺐어요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🩺 기초 체력&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💵&lt;/span&gt;&lt;b &lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;일진전기&lt;small&gt;015860&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;7,060원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;일진전기 — 최근 1년 한 달에 49억 버는 회사. 지금 주가는 과거만큼만 커도 설명되는 가격이에요(기대가 크지 않은 편).&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;💵 최근 1년 한 달 49억 벌어요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;💰 빚 빼고 현금만 4,767억 — 회사값보다 많아요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;🛟 장부상 순자산이 회사값보다 315% 많아요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;🏠 6년이면 회사 통째로&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-09-30 18:12 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · 일진전기&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;p class=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 1982년 설립하여 2008년 지주회사로 전환, 2025년 지주회사에서 제외됨. 주요 종속회사는 전선·중전기의 일진전기, 공업용 다이아몬드 제조의 일진다이아몬드, 수소저장용기 제조의 일진하이솔루스 등을 포함하고 있음. 일진전기는 전세계 80여 개국에 진출한 중전기 기업이고, 일진다이아몬드는 글로벌 판매법인을 운영하는 세계 3대 공업용 다이아몬드 생산업체로 활동하고 있음.&lt;/p&gt;&lt;p class=&quot;q&quot;&gt;테마 — 전력기기&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;당사는 정부 보조금 지급 시기에 따른 매출 변동성을 낮추기 위하여, 수소 사업 고객 및 용도 다변화, 신제품 연구개발에 노력하고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260311004252&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;그러나 최근 수소위원회에서 발표된 에 따르면, 저배출 수소 생산량은 2030년까지 9~14Mtpa에 도달할 수 있으며, 이러한 성장은 대부분 중국, 유럽, 북미의 청정 수소 생산 프로젝트에 의해 주도되고 있습니다.&lt;/li&gt;&lt;li class=q&gt;국내는 특히, 2024년부터 액화수소충전소와 대용량 기체수소충전소 등 수소 상용차용 충전소가 확충되면서 수소 버스 보급에도 속도가 붙을 전망입니다.&lt;/li&gt;&lt;li class=q&gt;(4) 신규사업 등의 내용 및 전망 정부의 수소 버스 확대 정책에 맞추어, 당사는 완주공장 상용차 수소저장시스템 CAPA를 증설하였고, 국내외 시장 확대를 위한 품질고도화 체계 구축에 주력하고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260311004252&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;지금 주가는 앞으로 연 -15% 성장을 가정 — 과거 연 12%&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;(5) 조직도 2025   2025 조직도 가. 산업의 특성 부동산임대사업의 경우 투자규모가 비교적 큰 자본집약적 산업이며, 사업장의 입지가 매출 및 수익에 많은 영향을 미치며, 제품의 차별화에 많은 비용이 소요되고, 품질경쟁보다는 가격경쟁에 많이 의존하는 산업입니다.&lt;/li&gt;&lt;li class=q&gt;- 경쟁의 특성: 자금력에 의존하며 시장진출입이 자유로운 완전경쟁- 진입의 난이도: 부지매입 및 건축을 위한 자금력에 의하여 진입여부 결정- 경쟁요인: 건물입지, 규모 및 임대가격이 경쟁의 중요한 요소로 작용 1-1. 영업개황당사는 일진상표권의 소유주로서 브랜드의 가치제고 및 육성, 보호 활동을 종합적으로 수행해 나가고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260311004252&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 1982년 설립하여 2008년 지주회사로 전환, 2025년 지주회사에서 제외됨. 주요 종속회사는 전선·중전기의 일진전기, 공업용 다이아몬드 제조의 일진다이아몬드, 수소저장용기 제조의 일진하이솔루스 등을 포함하고 있음. 일진전기는 전세계 80여 개국에 진출한 중전기 기업이고, 일진다이아몬드는 글로벌 판매법인을 운영하는 세계 3대 공업용 다이아몬드 생산업체로 활동하고 있음.&lt;/p&gt;&lt;span class=&quot;chip&quot;&gt;전력기기&lt;/span&gt;&lt;div class=&quot;src&quot;&gt;비슷한 국내 회사 — HD현대일렉트릭, 효성중공업, LS ELECTRIC, 제룡전기 (연관도 DB)&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 지주회사(持株會社, Holding Company)란 다른 회사의 주식을 소유한 회사이며 단순히 주식을 소유하는 것만이 아니라, 해당회사의 법적기준 이상의 주식(의결권)을 보유함으로써 그 회사에 대하여 실질적인 지배권을 취득하는 것을 목적으로 하는 회사입니다. 지주회사는 크게 순수지주회사와 사업지주회사로 구분할 수 있습니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;사업보고서 매출 표를 재무제표와 맞추지 못해 표는 뺐어요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;src&quot; style=&quot;margin:2px 0 0&quot;&gt;DART 분기 실적 · 증권사 추정 중앙값&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;가까운 것부터 · 차트가 아니라 실적·수주·업황 같은 요인&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🩺 기초 체력&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💵&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;최근 1년 한 달에 약 49억 벌었어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏠&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;6년 벌면 회사를 통째로 사요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏦&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;1,000만원이면 배당 월 2.4만원 · 은행 2.6만원 — 은행보다 적어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;💰&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;번 만큼 현금도 들어왔어요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📈&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;과거만큼만 커도 지금 주가가 설명돼요 — 기대가 크지 않은 편 — 주가 기대 -15% · 과거 현금 +2%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🧩&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;3년간 그대로예요 — 내 몫이 유지돼요&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;밸류 — PBR 0.51배 (피어 9.98배) — 피어: 연관도 DB 전력기기 국내 3종목 중앙값&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;이익은 최근 4분기 실제(네이버), 배당은 최근 배당수익률(세전), 은행은 COFIX 신규취급액 3.18%(09/15)&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📐 10년 가격표 — 지금 싼 편일까?&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;이 회사의 지난 10년 PER·PBR 과 비교한 지금 위치 · 싸다고 오른다는 뜻은 아니에요&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px&quot;&gt;&lt;div style=&quot;min-width:0;background:#f7f8fa;border-radius:12px;padding:8px 4px;text-align:center&quot;&gt;&lt;div style=& &lt;/style&gt;&lt;style&gt;.view-bar{display:none!important}&lt;/style&gt;&lt;/head&gt;&lt;body data-view=&quot;plain&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;padding-bottom:80px&quot;&gt;&lt;div id=&quot;plain&quot;&gt;&lt;section class=&quot;card hero&quot;&gt;&lt;div class=&quot;nm&quot;&gt;RFHIC&lt;small&gt;218410&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;px&quot;&gt;58,500원&lt;/div&gt;&lt;div class=&quot;hl&quot;&gt;RFHIC — 올해 한 달에 47억 버는 회사. 지금 주가는 과거만큼만 커도 설명되는 가격이에요(기대가 크지 않은 편). 증권사가 목표가를 지금의 두 배 넘게 잡았어요.&lt;/div&gt;&lt;div style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;💵 올해 한 달 47억 벌어요&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;🧑‍💼 증권사 목표가 두 배 넘게&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#059669&quot;&gt;🚀 올해 이익 +30% 늘 전망&lt;/span&gt;&lt;span class=&quot;chip&quot; style=&quot;color:#191f28&quot;&gt;🏠 27년이면 회사 통째로&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;데이터 애널 리포트 · 2026-09-30 18:13 · 숫자는 전부 원본에서 코드가 계산&lt;/div&gt;&lt;/section&gt;&lt;style&gt;.primer{margin:10px 0;border:1px solid #d9d4f5;border-radius:12px;background:#fbfaff}.primer&gt;summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:15px;font-weight:800;color:#3a1d96}.primer&gt;summary::-webkit-details-marker{display:none}.primer&gt;summary:after{content:&#x27; 펼치기 ▾&#x27;;font-size:13px;font-weight:600;color:#6b7684}.primer[open]&gt;summary:after{content:&#x27; 접기 ▴&#x27;}.primer .pq{padding:4px 16px 12px}.primer h3{font-size:15px;margin:12px 0 6px;color:#191f28}.primer p,.primer li{font-size:14px;line-height:1.65;color:#333d4b;margin:4px 0}.primer ul{padding-left:18px;margin:4px 0}.primer .q{color:#4e5968;font-size:13px}.primer .src{font-size:12px;color:#8b95a1;margin-top:4px}.primer .bar{height:8px;border-radius:4px;background:#e5e0fb;margin:2px 0 8px}.primer .bar i{display:block;height:8px;border-radius:4px;background:#3a1d96}&lt;/style&gt;&lt;details class=&quot;primer&quot; id=&quot;primer&quot;&gt;&lt;summary&gt;📘 처음 보는 분을 위한 입문 · RFHIC&lt;/summary&gt;&lt;div class=&quot;pq&quot;&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;이 회사는 1999년에 설립된 반도체 전문 기업이에요. 주로 무선 통신 인프라나 방위 산업, RF 에너지 분야에 쓰이는 GaN(질화갈륨) 트랜지스터와 전력 증폭기 등을 만들고 있어요.&lt;/p&gt;&lt;p class=&quot;q&quot;&gt;테마 — 통신&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;자동 해설(gemini-3.1-flash-lite) · 숫자는 원본과 대조 통과 · 2026-09-25&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;p&gt;GaN 전력증폭기 등 &lt;b&gt;75%&lt;/b&gt; · 1,402억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:75%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;GaN 트랜지스터 등 &lt;b&gt;24%&lt;/b&gt; · 447억&lt;/p&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:24%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;주로 GaN 전력 증폭기를 판매하여 전체 매출의 약 75%를 벌어들이고 있어요. 나머지 약 24%는 GaN 트랜지스터 등을 판매해서 얻고 있습니다.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;자동 해설(gemini-3.1-flash-lite) · 숫자는 원본과 대조 통과 · 2026-09-25 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260331004907&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;2024년과 2025년 사업 개요 문구가 동일하여 새로운 사업이나 제품 변화가 없어요.&lt;/li&gt;&lt;li&gt;매출 실적 표에서 GaN 전력증폭기 매출이 2024년 대비 2025년에 크게 늘어난 것으로 나타나요.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서 2023·2024·2025 사업 개요 비교(자동 요약 groq:qwen/qwen3.8-27b · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;p&gt;무선 통신과 방위 산업, 위성 통신 분야에서 GaN 관련 시장이 꾸준히 커질 것으로 예상되고 있어요. 또한 군용 레이더 시장과 고출력 마이크로파 발생기 시장도 앞으로 규모가 더 커질 것으로 전망됩니다.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;자동 해설(gemini-3.1-flash-lite) · 숫자는 원본과 대조 통과 · 2026-09-25 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260331004907&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;p class=&quot;q&quot; style=&quot;margin-top:10px&quot;&gt;&lt;b&gt;증권사들은 이렇게 봐요&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;하나증권&lt;/b&gt; 09/16 — 방산 수출이 잘 되고 자회사 실적도 좋아서 올해 이익이 늘고, 내년에 5G 주파수 경매가 열리면 통신 사업까지 크게 성장할 것으로 보입니다. 필요한 장비를 만들 수 있는 회사가 줄어드는 상황에서 수요는 계속 커지니, 앞으로 이익이 더 늘고 주가도 오를 가능성이 높다고 봅니다.&lt;/li&gt;&lt;li&gt;&lt;b&gt;신한투자증권&lt;/b&gt; 07/28 — 이 회사는 방위산업과 자회사에서 높은 이익을 기대할 수 있어요. 그래서 앞으로 성장 가능성이 크다고 생각해요.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 본문 요약(자동) · 숫자는 원문 대조 · 의견·목표가는 뺐어요&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;p&gt;증권사 보고서에 따르면 2026년 매출은 2025년보다 42%, 2027년에는 76%까지 성장할 것으로 예상하고 있어요. 현재 주가는 앞으로 매년 22%씩 성장한다는 가정을 바탕으로 계산된 수치입니다.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;자동 해설(gemini-3.1-flash-lite) · 숫자는 원본과 대조 통과 · 2026-09-25&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;p&gt;무선 통신 분야는 국가의 통신 서비스 발전이나 가입자 규모에 따라 수요가 달라질 수 있어요. 또한 글로벌 위성 산업의 규모와 전망에 영향을 받을 수 있다는 점을 참고해야 해요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;자동 해설(gemini-3.1-flash-lite) · 숫자는 원본과 대조 통과 · 2026-09-25 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260331004907&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 1999년 설립된 반도체 전문기업으로, 2017년 코스닥에 상장했으며, 4개 종속회사를 보유하고 있음. 주요 제품은 GaN 트랜지스터, 전력증폭기, Microwave Generator로, 무선통신 인프라, 방위산업, RF 에너지에서 활용되고 있음. 동사는 국내 유일의 GaN 트랜지스터 대량 생산 기술로 Form Factor 제품을 개발하여 5G SA 전환 및 새로운 적용처 확대에 대응하고 있음.&lt;/p&gt;&lt;span class=&quot;chip&quot;&gt;통신&lt;/span&gt;&lt;div class=&quot;src&quot;&gt;비슷한 국내 회사 — RF머트리얼즈, 케이엠더블유, 에이스테크, 쏠리드 (연관도 DB)&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;div class=&quot;k uot;src&quot;&gt;리포트 3건(신한투자증권, 하나증권, 한국IR협의회) — 표의 실적 연도 매출을 DART 와 맞대 단위를 확인 · 그중 1건은 규칙이 못 읽어 LLM 이 표를 읽음(같은 대조 통과)&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🧑‍💼 증권사들은?&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;증권사별 가장 최근 목표가 기준 · 우리는 목표가를 내지 않아요&lt;/p&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;최근 6개월 리포트&lt;/span&gt;&lt;b&gt;8건 · 2곳&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;목표가 중앙값&lt;/span&gt;&lt;b&gt;115,500원 (+97%)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;목표가 범위&lt;/span&gt;&lt;b&gt;81,000 ~ 150,000원&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;의견&lt;/span&gt;&lt;b&gt;매수 2 · 중립 0&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;최근 90일 목표가&lt;/span&gt;&lt;b&gt;상향 1 · 하향 0&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot;&gt;&lt;span&gt;이 종목 목표가 과거 성적&lt;/span&gt;&lt;b&gt;6개월 안 도달 46% (37건)&lt;/b&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;💡 목표가는 6개월 안에 46%만 닿았어요 · &amp;#x27;중립&amp;#x27;은 지수를 29%만 이겨 사실상 매도예요 · 목표가를 올린 리포트가 가장 나았어요(지수 대비 +15%) — 2022년 이후 리포트 4,887건 측정(2026-09-24)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;네이버 리서치 상세(목표가·작성일 주가) + 수정주가 일봉 — analyst_scorecard&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🔄 누가 사고 있나&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🌏&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;외국인 최근 20일 중 8일 샀어요 (60일 중 29일)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🏛️&lt;/span&gt;&lt;b style=&quot;color:#059669&quot;&gt;기관 최근 20일 중 13일 샀어요 (60일 중 30일)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;키움 투자자별 일별 순매수&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📉 차트 상태&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;🎯&lt;/span&gt;&lt;b style=&quot;color:#191f28&quot;&gt;기술 조건 충족도 77점 — 높음&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&g lass=&quot;q&quot;&gt;회사 원문(④ ⑥)은 공시 말투예요. 쉬운 해설이 준비되면 이 자리에 나와요.&lt;/p&gt;&lt;h3&gt;① 무슨 회사?&lt;/h3&gt;&lt;p&gt;동사는 2006년 설립되어 PCB, 글래스기판 및 복합동박 제조공정에 사용되는 자동화장비의 개발, 제조 및 판매를 주요 사업으로 영위하고 있음. 2022년 신영해피투모로우제5호기업인수목적 주식회사와 합병을 완료하여 코스닥시장에 상장하였으며, 2개의 비상장 종속회사를 보유하고 있음. 동사의 사업영역은 PCB 제조 공정 자동화 장비를 기반으로 글래스 기판 제조공정 장비 및 2차전지 소재 제조 공정 장비 분야로 확대되고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;WiseReport 기업개요 · 연관도 DB&lt;/div&gt;&lt;h3&gt;② 어떻게 돈을 버나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;당사는 이러한 복잡한 PCB 장비 시장에서 특정 PCB 제품군이나 특정 고객사만을 상대로 매출이 발생하는 것이 아니고 PCB 전체 제품군에 대한 장비기술과 노하우를 바탕으로 PCB 시장 변화에 따라 변화하는 PCB 제품군에 적합한 장비 판매가 가능하여 지속적이고 안정적인 매출을 발생시키고 있습니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 매출 표(재무제표와 대조) · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323000642&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;③ 최근 3년 무엇이 달라졌나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;아직 비교하지 못했어요(사업보고서 2개 이상이 있으면 밤에 채워요)&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;DART 사업보고서  사업 개요 비교(자동 요약  · 숫자 원문 대조)&lt;/div&gt;&lt;h3&gt;④ 왜 유망하다고 하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;2) 2026년 PCB 전망AI 인프라 투자 확대, 미래차 전장(ADASㆍEV) 성장, 고성능 반도체 패키징 수요 증가에 힘입어 안정적이고 구조적인 성장세를 이어갈 것으로 전망된다.&lt;/li&gt;&lt;li class=q&gt;AI 서버 아키텍처의 세대 교체와 글로벌 4대 클라우드 업체의 ASIC 칩 도입 가속화로 ABF 기판 수요가 지속적으로 증가하고 있습니. 고사양 ABF 생산능력은 꾸준히 확대 중이며, 2026년 상반기부터 본격적인 시장 회복과 성장세가 예상됩니다.&lt;/li&gt;&lt;li class=q&gt;약품 산업은 AI, 자동차 전장, 5G/IoT 등 PCB 수요 확대와 고도화된 기판 기술 수요 증가로 성장세를 이어갈 전망입니다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323000642&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;h3&gt;⑤ 언제까지 성장하나&lt;/h3&gt;&lt;p class=&quot;q&quot;&gt;증권사 추정이 2곳 미만이라 비워 뒀어요&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;증권사 리포트 추정 표 · 역DCF(우리 계산)&lt;/div&gt;&lt;h3&gt;⑥ 무엇을 조심하나&lt;/h3&gt;&lt;ul&gt;&lt;li class=q&gt;2025년 하반기부터 AIㆍ자동차 전장ㆍ5G/IoTㆍ의료기기 등 다양한 수요 확대가 PCB 시장 성장을 견인하는 가운데, 기술 고도화와 설계 자동화ㆍ지속가능성 대응이 핵심 전략으로 부상하지만, 원자재 가격 변동, 환경 규제 강화, 설계 복잡 도 증가는 주요 리스크로 작용하고 있습니다.&lt;/li&gt;&lt;li class=q&gt;후방산업(소재ㆍ설비ㆍ약품) 2026년 원자재 산업은 AI 서버 시장이 원자재 수요를 견인하는 핵심 엔진이 되고 있으며, 특히 유리섬유, 특수 금속 등 전통적으로 틈새였던 소재들이 핵심 재료로 부상할 가능성 높습니다.&lt;/li&gt;&lt;li class=q&gt;최근 3년 주식 수 +22% — 같은 이익을 더 많은 주식이 나눠 가져요&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;src&quot;&gt;DART 2025 사업보고서 원문 · DART 주식 수 · &lt;a href=&quot;https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323000642&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;사업보고서 원문&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;숫자는 원본에서 코드가 계산 · 문장은 회사 공시 원문 · 매수·매도 판단이 아니에요&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏢 무슨 회사?&lt;/h2&gt;&lt;p style=&quot;font-size:14px;line-height:1.6;margin:6px 0&quot;&gt;동사는 2006년 설립되어 PCB, 글래스기판 및 복합동박 제조공정에 사용되는 자동화장비의 개발, 제조 및 판매를 주요 사업으로 영위하고 있음. 2022년 신영해피투모로우제5호기업인수목적 주식회사와 합병을 완료하여 코스닥시장에 상장하였으며, 2개의 비상장 종속회사를 보유하고 있음. 동사의 사업영역은 PCB 제조 공정 자동화 장비를 기반으로 글래스 기판 제조공정 장비 및 2차전지 소재 제조 공정 장비 분야로 확대되고 있음.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처 WiseReport 기업개요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🏭 무엇으로 버나&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;품목·사업부별 매출 (최근 사업연도)&lt;/p&gt;&lt;p style=&quot;font-size:13px;line-height:1.6;color:#4e5968;margin:10px 0 0&quot;&gt;회사 설명 — 당사는 한국표준산업분류상 그 외 기타 특수 목적용 기계 제조업(C29299)에 속하는 회사로, 전자소재 및 전자부품 제조 공정에 사용되는 장비를 생산 및 공급하고 있습니다. 당사의 사업은 PCB 제조 공정 자동화 장비를 기반으로 하여 글래스 기판 제조공정 장비 및 2차전지 소재 제조 공정 장비 등 전자소재 제조 공정 장비 분야로 확대되고 있습니다&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;사업보고서 매출 표를 재무제표와 맞추지 못해 표는 뺐어요&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🗓️ 앞으로 확인할 것&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;📅&lt;/span&gt;&lt;div&gt;&lt;b&gt;26.3Q 실적 발표 — 보통 10월 하순 잠정 실적 · 늦어도 11월 14일&lt;/b&gt;&lt;div class=&quot;   function fit(f){try{var d=f.contentDocument;if(!d||!d.body)return;var w=d.defaultView,cs=w.getComputedStyle(d.body);
