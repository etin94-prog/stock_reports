const stocks=[{"code": "000660", "name": "SK하이닉스", "documents": {"reader": "stockeasy_000660_reader.html", "source": "stockeasy_000660_source.html", "report": "bear_research_000660.html", "followup": "stockeasy_000660_followup.html"}, "question": "SK하이닉스 후속 확인입니다. 자료별 작성일·단위·원문 링크를 붙여 주세요.\n① 공식 10/28 발표의 LTA 50%는 2027~2028 전체 생산능력 기준입니다. HBM만의 확정 물량 및 취소·미인수·가격 조정 조건을 별도로 확인해 주세요.\n② 자사주 매입은 공식 8월 40조원, 10월 20조원(소각 10조·임직원 보상 약 10조)입니다. 답변의 4조439억원·2조77억원을 대조하고, 발행·자기·가중평균 유통주식수로 EPS를 다시 연결해 주세요. 501,374원의 순이익 365조원과 분모 출처도 필요합니다.\n③ 정상화 EPS 86,380원을 HBM·DRAM·NAND 매출/마진→세전이익→지배순이익→EPS로 설명해 주세요. 역사 저점 PER 6~6.4·PBR 1배는 날짜와 당시 이용 가능 EPS/BPS를 보여 주세요.\n④ 544,390×0.3~0.8은 163,317~435,512원인데 표와 다릅니다. 정정해 주세요.\n⑤ 공식 3분기 순현금 98.7조원과 답변의 2분기 수치를 기간·범위별로 맞추고, 기관별 OCF−CAPEX=FCF−배당−매입−상환→기말 현금을 연결해 주세요. 전망 범위를 섞지 말고 투자·환원 후에도 버틸 근거와 무효 조건을 정리해 주세요.", "characters": 601, "reviewed": "2026-11-08", "theses": [{"title": "장기 계약이 버팀목이지만 가격까지 보장하지 않는다", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "회사 10/28 발표는 2027~2028년 전체 생산능력의 50% 이상에 대한 LTA와 3분기 말 순현금 98.7조원을 제시했다. 물량 가시성과 재무 여력이 하락장 방어의 출발점이다.", "counter": "가격은 합의 범위 내 시장 연동이다. HBM 2029년 전량 확정·예치금 몰수 조건은 이번 공식 발표에서 확인되지 않는다. 범용 메모리 가격 하락과 투자·환원 지출이 현금 완충력을 줄일 수 있다.", "next": "HBM4 출하와 고객 인수, DRAM·NAND 가격, 투자·환원 후 순현금을 함께 확인한다. 납품 지연과 현금 감소가 겹치면 이익 유지 가정을 낮춰 재검토한다.", "sources": ["official_q3"]}, {"title": "역산으로 맞춘 EPS를 검증된 정상 이익으로 바꾸지 않기", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "365조원÷7억2,800만주는 약 501,374원이다. 계산이 맞더라도 해당 기관의 지배순익과 가중평균 주식 수가 실제 그 조합인지는 별도 대조가 필요하다.", "counter": "86,380원의 제품별 마진 설명은 기준 보고서·시점·페이지를 특정하지 못했다. 과거 낮은 전망치를 가져오는 것만으로 불황의 정상 이익이 되지 않는다. BPS 544,390원×0.3~0.8은 163,317~435,512원이며 회귀 절편으로 차이를 해명할 원식도 미확인이다.", "next": "같은 기관·연도의 HBM/DRAM/NAND 이익, 비영업손익, 세금, 주식 수를 연결한다. 소각 효과와 본업 이익 개선을 나누고 역사적 PBR을 자동 매수선으로 쓰지 않는다.", "sources": ["r0", "r1"]}, {"title": "2027년 EPS를 현재의 이익처럼 읽지 않기", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "iM의 2026년 EPS는 358,973원, 2027년은 513,110원이다. 현재가의 낮은 선행 배수는 다음 해 이익이 크게 유지·확대되는 조건에 의존한다.", "counter": "HBM만 성장하고 범용 DRAM·NAND 가격이 하락하면 전체 순이익은 달라진다. 환율과 지분·금융손익도 영업이익과 EPS 사이의 차이를 만든다.", "next": "HBM·DRAM·NAND별 매출과 영업이익에서 지배주주 EPS까지 연결하고, ASP 하락과 수율 지연을 동시에 반영한 정상화 EPS를 제시해 달라.", "sources": ["r0", "r1"]}, {"title": "PBR 2.3배 목표는 불황 바닥이 아니다", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "iM은 2027년 예상 BPS 1,002,994원에 2.3배를 적용한다. 큰 이익 유보와 높은 평가 배수를 함께 요구하는 목표가 산식이다.", "counter": "미래 BPS 증가가 예상에 못 미치거나 시장이 더 낮은 ROE를 예상하면 배수도 함께 낮아질 수 있다. 성장 전망 하향과 배수 축소가 겹치는 경우를 봐야 한다.", "next": "과거 저점의 당시 BPS·ROE·손상차손을 확인하고, 회복 전까지 버틸 자본 및 현금 여력을 같은 시점 자료로 대조해 달라.", "sources": ["r0", "r1"]}, {"title": "자사주 가정이 EPS를 부풀리는지 확인", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "공식 발표상 8월 자사주 매입 40조원은 완료됐고, 10월 이사회는 20조원 매입을 결정했다. 이 중 10조원은 소각, 약 10조원은 임직원 보상용이다. 첨부의 4조439억원·2조77억원과 다르다.", "counter": "매입 주식 전부가 소각되는 것은 아니다. EPS 분모는 가중평균 유통주식수와 보상주식 재교부를 반영해야 한다. 첨부의 소각 전 EPS 501,374원은 선택한 순이익 365조원·주식수 7억2,800만주의 가정 계산이지 공식 조정 EPS가 아니다.", "next": "승인된 환원 정책과 분석가 가정을 분리하고, 자사주 효과를 제외한 EPS 및 CAPEX·차입 만기 후 현금을 보여 달라.", "sources": ["official_q3", "r1", "stockeasy"]}, {"title": "현금 방어력은 확인하되 환원 이후 잔액을 따로 본다", "status": "공식 발표 대조 · 잠정·계획 구분", "body": "회사 발표상 3분기 말 현금성 자산 114.5조원, 차입금 15.8조원, 순현금 98.7조원이다. 첨부의 2분기 잔액보다 최신 자료다. 다만 현금성 자산의 구성은 재무제표 주석과 맞춰야 한다.", "counter": "CAPEX·차입 상환·배당·소각용 매입·보상용 매입을 모두 빼기 전 잔액을 영구적 안전마진으로 볼 수 없다. 첨부 FCF 범위는 기관별 정의가 섞여 OCF−CAPEX와 그대로 맞지 않는다.", "next": "기관별 같은 연도 OCF−유형/무형자산 투자=FCF를 맞추고 환원 후 기말 현금을 연결해 달라.", "sources": ["official_q3", "stockeasy"]}, {"title": "51만~55만원을 검증된 바닥으로 채택하지 않는다", "status": "첨부 산식 검토 · 가정 보류", "body": "첨부는 EPS 86,380원×PER 6.0~6.4배=518,280~552,832원, BPS 510,183~544,390원×PBR 1배를 제시한다. 곱셈과 정상화 이익의 타당성은 별개다. EPS 산출 과정과 역사적 배수의 당시 이용 가능한 자료를 확보하지 못했다.", "counter": "첨부 극단 하단 표는 BPS 544,390원×0.3~0.8배인데 185,952~456,879원으로 적혀 있다. 같은 입력의 단순 계산은 163,317~435,512원이다. 이 정정도 적정가나 매수 구간을 입증하지 않는다.", "next": "정상화 EPS의 제품별 매출·마진·세금·주식수 산식, 과거 저점 날짜 및 동일 기준 EPS/BPS를 제시해 달라.", "sources": ["r1", "stockeasy"]}], "jpg": "dashboard_summary_000660.jpg"}, {"code": "005930", "name": "삼성전자", "documents": {"reader": "stockeasy_005930_reader.html", "source": "stockeasy_005930_source.html", "report": "bear_research_005930.html", "followup": "stockeasy_005930_followup.html"}, "question": "삼성전자 답변을 공식 자료와 대조해 정정해 주세요. 저평가 결론보다 산식 검증이 우선입니다.\n① 삼성전자 2026-10-29 공식 발표의 3분기 EPS는 보통주 11,462원·우선주 11,492원인데 답변은 12,851원입니다. 연결/지배주주 이익, 보통주·우선주 배분, 가중평균 주식 수를 연결해 차이를 설명해 주세요.\n② 정상화 EPS 39,344원의 메모리 이익 25조원 차감 근거와 세율·비경상 손익·분기 연율화 산식을 제시해 주세요. 이미 포함된 DX·파운드리 적자를 중복 차감하지 마세요.\n③ 본문 가격 21만~23만원·기술 분석 188,700원·당사 11/06 종가 193,500원의 날짜와 시장을 맞춰 주세요. 11/08은 일요일입니다.\n④ BPS 85,682원의 기준일과 산식, 저점 PBR 0.9~1.0배의 당시 공개 재무 근거를 제시해 주세요. 계산 하단을 확정 바닥으로 부르지 마세요.\n⑤ 2027 EPS 74,427원은 iM 개별 전망과 시장 컨센서스를 구분해 주세요. 회사 확정 환원과 분석가의 FCF 배분 가정도 분리해 주세요.\n⑥ OCF−CAPEX에서 배당·자사주·차입 변동까지 연결한 기말 현금표를 작성하고, 순차입금·순현금 부호를 명시해 주세요. HBM 계약의 비공개 조건은 미확인으로 표시해 주세요.\n모든 수치에 원문 URL·날짜·단위·실적/전망/가정을 붙여 주세요.", "characters": 679, "reviewed": "2026-11-08", "theses": [{"title": "메모리가 버는 현금이 다른 사업의 부담을 감당하는가", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "회사 10/29 발표에서 3분기 DS 영업이익은 106.5조원, DX는 0.8조원 적자다. HBM4·서버 메모리 판매 확대는 방어 근거지만 현재 이익을 장기 정상 이익으로 고정할 수는 없다.", "counter": "메모리 가격·출하가 약해지는 동안 DX·파운드리 부담이 이어지면 전사 이익이 더 빨리 줄 수 있다. 2026년 순현금 237.7조원 등 전망을 이미 보유한 현금으로 읽으면 안 된다.", "next": "DS 수익성, DX 손익과 OCF−투자−환원 뒤 현금을 확인한다. HBM 인증·양산 일정이 실제 출하로 이어지는지 보고, 납품 지연과 이익 전망 하향이 겹치면 버틸 근거를 재평가한다.", "sources": ["official_q3", "r0", "r1"]}, {"title": "공식 EPS와 정상화 시나리오를 분리", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "공식 3분기 보통주 EPS는 11,462원, 우선주는 11,492원이다. 후속 답변의 12,851원은 공식 EPS로 채택하지 않는다. iM 11/04의 2027F EPS 74,427원은 개별 기관 전망이다.", "counter": "EPS 39,344원을 만들기 위한 메모리 이익 25조원 조정은 별도 가정이다. 연결 이익에 이미 포함된 DX 적자를 다시 빼면 중복이지만, 답변이 말한 모든 정상화 계산이 실제 중복인지도 손익 연결표가 필요하다.", "next": "제품별 이익에서 세금·비지배지분·보통/우선주 배분까지 같은 기간으로 연결한다. 자사주 매입 가정과 승인된 환원을 분리하고 HBM 계약의 비공개 취소 조건은 미확인으로 유지한다.", "sources": ["official_q3", "r1"]}, {"title": "낮은 선행 PER의 분모는 높은 미래 이익", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "iM의 EPS 전망은 2026년 46,029원, 2027년 74,427원이다. 이 수치를 사용하면 낮은 배수가 나오지만 전망 자체가 메모리 이익 확대를 전제한다.", "counter": "메모리 가격과 출하가 동시에 꺾이면 EPS 하향 폭이 클 수 있다. HBM 성장과 범용 DRAM·NAND 둔화를 함께 계산해야 한다.", "next": "메모리 ASP·출하·마진을 분해하고, 파운드리·System LSI·MX 손익을 합친 정상화 EPS를 제시해 달라.", "sources": ["r0", "r1"]}, {"title": "PBR 목표가와 가치 바닥은 다른 질문", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "iM은 2027년 예상 BPS 159,234원에 2.3배를 적용해 목표가를 제시한다. 이 배수는 장기 평균보다 높은 구간을 근거로 한 재평가 논리다.", "counter": "예상 BPS는 아직 벌지 않은 이익을 포함한다. 높은 ROE 지속을 전제로 한 목표 배수를 불황의 최저 배수로 사용하면 안전마진을 과대평가한다.", "next": "당시 이용 가능했던 BPS와 정상화 ROE로 과거 하락기 PBR을 다시 계산하고, 2027년 전망 미달 시 적정 배수 민감도를 보여 달라.", "sources": ["r0", "r1"]}, {"title": "환원 여력은 확인된 계획과 분석가의 미래 배분 가정을 나누기", "status": "회사 공식 발표 + 증권사 가정 구분", "body": "회사는 2026년 시설투자 계획 84.4조원, 총 주주환원 규모 90~110조원과 잔여재원 55~75조원을 설명했다. 잔여재원의 최종 규모·방법과 차기 정책은 2027년 1월 말 이사회에서 확정할 계획이다. 따라서 발표된 방향과 아직 확정되지 않은 세부 집행을 구분해야 한다.", "counter": "iM의 2027~2029년 FCF 50% 환원, 그중 배당 70%·자사주 30%는 원문에 명시된 분석가 가정이다. OCF−CAPEX는 배당·자사주 지급을 모두 차감한 잔여 현금이 아니다. 첨부의 장래 순현금 400~500조원만으로 파산 위험을 배제하거나 현금이 주가 하락을 막는다고 단정하지 않는다.", "next": "기초 현금+영업현금−전체 투자−배당−자사주±차입·기타 흐름=기말 현금으로 연결하고, 확정·계획·전망을 표시한다. 자사주 매입과 소각 시점을 EPS 계산에도 일치시킨다.", "sources": ["r0", "r1", "official_q3"]}, {"title": "공식 분기 EPS와 첨부의 정상화 EPS 계산은 다르다", "status": "공식 발표 대조 · 첨부 정상화 계산은 가정", "body": "공식 3분기 발표의 보통주 EPS는 11,462원, 우선주는 11,492원이다. 첨부의 12,851원과 일치하지 않는다. 공식 부문 손익은 DS 106.5조원, DX −0.8조원으로 이익 쏠림과 세트 사업의 부담을 함께 볼 필요는 있다.", "counter": "첨부의 정상화 EPS 39,344원은 메모리 이익 25조원 차감, 비경상 요인 차감, 고정된 순이익/영업이익 비율과 주식 수를 조합한 계산이다. 25조원 차감의 실증 근거, 연결 순이익과 지배주주 이익, 보통주·우선주 배분, 가중평균 주식 수가 확인되지 않아 확정 정상 이익으로 채택하지 않았다. 이미 전사 손익에 포함된 부문 적자의 중복 차감도 확인해야 한다.", "next": "공식 EPS와 연결 순이익을 출발점으로 지배주주 이익·종류주식 배분·가중평균 주식 수를 연결한 뒤, 메모리 ASP·출하·원가 변화로 정상화 가정을 다시 작성한다.", "sources": ["official_q3", "stockeasy"]}, {"title": "PBR 하단과 PER 하단이 서로 다른 이야기를 하는 이유", "status": "첨부 가치 가정 검토 · 바닥 가격 채택 보류", "body": "첨부는 BPS 85,682원에 0.9~1.0배를 곱한 약 7.7만~8.6만원과, 높은 예상 EPS에 낮은 PER를 적용한 약 19.8만~25.3만원을 함께 제시한다. 산식이 서로 다른 이익·자본·평가 전제를 쓰므로 두 범위를 하나의 안전한 가격대로 합칠 수 없다.", "counter": "BPS 85,682원의 기준 분기·보통주/우선주 산식과 역사적 저점 배수의 당시 재무 기준은 미확인이다. 첨부의 가격도 본문 21만~23만원과 기술 분석 188,700원이 혼재한다. 당사 기준 종가는 11월 6일 193,500원이며 서로 다른 시점의 가격과 배수를 섞지 않았다.", "next": "BPS 기준일과 당시 공개 EPS/BPS를 확인하고, 동일 기준 가격으로 PER·PBR을 다시 계산한다. 가격 바닥을 주장하기 전에 이익 하락과 자본 훼손을 동시에 반영한다.", "sources": ["r1", "stockeasy"]}], "jpg": "dashboard_summary_005930.jpg"}, {"code": "039490", "name": "키움증권", "documents": {"reader": "stockeasy_039490_reader.html", "source": "stockeasy_039490_source.html", "report": "bear_research_039490.html", "followup": "stockeasy_039490_followup.html"}, "question": "키움증권 후속 검증입니다. 원문 링크·페이지·기준일·연결/별도·실적/추정을 붙여 주세요. ① 3Q 지배순익 2,386억원의 컨센서스 하회율: 유안타·하나11/2는34.7%, 답변은37.5%입니다. 비교 컨센서스와 산식을 맞춰 주세요. ② 정상 ROE11~13%·EPS3.8만~4.5만원을 거래대금·실효수수료율·신용잔고·평가손실·세금으로 재구성. ③ 본사PF 우발채무4.57조원·자회사PF5,412억원의 잔액/담보/LTV/선후순위/충당금/중복 및 기준일을 대조. ④ 신NCR·구NCR·규제 레버리지·단순 자산/순자산12.7배를 구분하고 최신 확정치·적용 규정·완충액을 제시. 고객예탁금 제외. ⑤ DPS18,500/12,000원은 전망, 감액배당은 승인 여부와 별도 배당 재원·NCR 영향을 확인. ⑥ ROE10.7·COE12.9·g2·할인30%·BPS316,224원으로176,100원이 나오는 반올림 전 산식을 제시. 11/8은 휴장일이므로186,400원의 실제 거래일과 출처도 확인해 주세요.", "characters": 500, "reviewed": "2026-11-08", "theses": [{"title": "낮은 PER보다 반복 가능한 이익", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "유안타의 EPS 전망은 2026년 64,933원에서 2027년 58,714원으로 낮아진다. 거래대금 둔화로 다음 해 이익이 감소할 가능성을 먼저 반영해야 한다.", "counter": "거래량·수수료율·신용 잔고가 함께 줄면 증권사의 영업 레버리지는 반대로 작동한다. 해외 직접 중개 비용 절감이 전체 경기 민감도를 없애지는 않는다.", "next": "국내·해외 거래대금, 실효 수수료율, 신용공여 잔고를 분해하고 평균 거래 환경에서의 정상 EPS·ROE를 계산해 달라.", "sources": ["r0", "r1"]}, {"title": "평가손실이 정말 일회성인지", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "하나와 유안타는 3분기 연결 지배주주 순이익 약 2,386억원과 펀드 등 평가손실의 영향을 설명한다. 별도 이익과 연결 이익의 차이가 중요하다.", "counter": "이번 손실을 모두 제외해 정상 이익이라고 부르면 반복되는 위험 자산 손실을 놓칠 수 있다. 평가손실의 세무상 처리도 실효세율을 바꾼다.", "next": "손실 자산의 잔존 익스포저·평가 기준·추가 손실 가능성과 세금 효과를 공개 근거로 확인해 달라.", "sources": ["r0", "r1"]}, {"title": "증권사의 방어력은 제조업 FCF로 판단하지 않는다", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "고객예탁금과 담보자산은 주주가 자유롭게 사용할 수 있는 현금이 아니다. 순자본비율·레버리지·유동성·PF 보증 및 우발채무가 우선 점검 항목이다.", "counter": "장부가가 높아도 자산 손실과 규제 자본 제약으로 배당·자사주 여력이 줄 수 있다. 공시 없이 자본적정성이 충분하다고 단정하지 않는다.", "next": "최신 NCR·유동성·레버리지 규제 여유와 PF·신용공여 담보 집중을 확인하고 주가 급락·부실 발생 스트레스를 제시해 달라.", "sources": ["r0", "r1"]}, {"title": "예상 배당과 승인된 배당은 다르다", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "배당 판단에는 별도 재무의 배당 가능 이익과 규제 제약을 함께 봐야 한다. 하나는 지속가능 ROE 14%·자기자본비용 11.4%를 목표가 전제로 제시한다.", "counter": "감액배당 실시 가능성과 증권사 예상 배당을 확정 지급처럼 표현할 수 없다. ROE가 자기자본비용을 밑돌면 낮은 PBR이 지속될 수 있다.", "next": "승인된 배당과 기관 전망을 나누고 별도 배당 재원·NCR 영향·지속가능 ROE 및 자본비용 민감도를 보여 달라.", "sources": ["r0", "r1"]}], "jpg": "dashboard_summary_039490.jpg"}, {"code": "058470", "name": "리노공업", "documents": {"reader": "stockeasy_058470_reader.html", "source": "stockeasy_058470_source.html", "report": "bear_research_058470.html", "followup": "stockeasy_058470_followup.html"}, "question": "리노공업 후속 검증입니다. 수치에 원문 URL·쪽·날짜·단위와 실적/전망/가정을 붙여 주세요. ① LS 9/29 EPS 2026년2,357·2027년2,720원, 메리츠10/12 2,391·2,753원을 주식분할·희석주식 수까지 원문 대조. ② 영업이익 본문2,285→2,090억원과 표228.5→209.0억원의 10배 단위 차이를 정정하고 같은 기관·연도의 전후 추정치를 제시. ③ R\u0026D70~75%의 분모는 전체 매출인지 IC소켓인지, 회사 공시인지 증권사 추정인지 확인. 개발 프로젝트 취소·양산 감소를 각각 스트레스에 반영. ④ 정상화 EPS1,800원과 PER20배 하단의 근거: 당시 이용 가능 EPS·수정주가·저점 날짜를 제시하고 16배 이하 사례도 포함. ⑤ 순현금4,551억원과 순차입금−4,501억원을 같은 날짜·금융자산 정의로 맞추고 잔여 공장 CAPEX·배당·운전자금을 뺀 12~24개월 현금표 작성. ⑥ 생산 복귀 발표와 실제 출하·가동률·마진 회복을 구분하고, EPS 유지와 PER회복을 별개 가정으로 제시해 주세요. 확인 불가는 미확인으로 남겨 주세요.", "characters": 548, "reviewed": "2026-11-08", "theses": [{"title": "버틸 조건은 개발 수요 유지와 이연 주문의 실제 출하", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "메리츠 10/12 원문은 생산 정상화를 파악하고 4분기 이연 출하를 예상했다. 2026년 OCF 1,791억원−유형 투자 624억원=1,167억원 전망은 투자 후 현금 여력의 근거다. 다만 배당 전 차액이며 확정 현금이 아니다.", "counter": "고객 개발 프로젝트 축소·출하 취소·인건비와 이전 비용 증가는 방어 논리를 약화시킨다. R\u0026D 70~75%는 분모가 불명확한 외부 추정이며 이 비율만으로 매출 대부분이 안전하다고 볼 수 없다.", "next": "다음 실적에서 소켓 매출·제품 믹스·이익률·매출채권 회수를 함께 본다. 출하는 회복돼도 마진과 현금이 나빠지면 이익 방어 가정을 다시 점검한다.", "sources": ["meritz", "annual", "meritz_pdf"]}, {"title": "기술 경쟁력이 실제 가격과 이익으로 연결될 조건", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "메리츠는 미세 피치·신뢰성을 요구하는 CPO 테스트와 신규 패키징용 소켓 확대를 전망한다. 기존 설계·검증 경험이 고객 전환 부담을 높일 수 있다는 해석은 가능하지만 확정 가격 결정력은 아니다.", "counter": "고객별 전환 비용·단가 협상·CPO 실제 매출 비중은 공개 자료로 정량 확인하지 못했다. 후속 답변의 양산 20% 감소/R\u0026D 15% 취소에 따른 영업이익 1,810/1,530억원도 원가 함수가 없는 시나리오다.", "next": "개발·양산 단계, 실제 주문, 고부가 소켓 믹스와 단가를 확인한다. 기술 설명만 유지되고 매출·마진이 하락하면 상업적 경쟁력 해석을 수정한다.", "sources": ["meritz"]}, {"title": "현금과 가치 하단의 확신을 나누기", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "메리츠 10/12 PDF p.2의 2026E 영업이익은 209.0십억원=2,090억원이다. p.6/7의 EPS 2026E 2,391원·2027E 2,753원도 확인했다. LS 수치와 상세 가중평균 주식 수 연결은 별도 확인이 남았다.", "counter": "순현금 4,551억원과 순차입금 −4,501억원의 50억원 차이를 금융자산 분류 차이라고 단정할 주석은 미확인이다. PER 20배 절대 하단뿐 아니라 새 답변의 과거 13~16배 사례도 날짜·당시 EPS를 확인하지 못했다.", "next": "같은 기준일 현금·금융상품·부채와 잔여 공장 투자·배당을 연결한다. EPS 방어와 PER 회복은 별개이므로 현금 체력만으로 특정 가격이 바닥이라고 결론 내리지 않는다.", "sources": ["annual", "meritz", "meritz_pdf"]}, {"title": "파업 충격 뒤 실적 회복의 연결 고리", "status": "증권사 조사·전망 확인 · 확정 실적 아님", "body": "메리츠 리서치의 10월 12일 자료는 당시 평시 수준 생산량을 파악했다고 설명했다. 3Q26 매출 862억원·영업이익 386억원, 4Q26 영업이익 496억원을 전망했다. 노사 협의는 계속된다는 설명도 있어 생산 정상화와 협상 종결은 구분한다.", "counter": "4분기 반등의 전제는 밀린 주문이 취소되지 않고 출하·매출로 연결되는 것이다. 생산량 회복만으로 이익 회복이 확정되지는 않는다. 계절적 비수기, 인건비, 공장 이전 비용이 마진을 낮출 수 있으며 미출하 주문의 정량적 잔고·취소액은 이번 자료에서 확인하지 못했다.", "next": "다음 공시에서 출하·매출과 이익률을 함께 확인한다. 생산은 회복됐는데 매출이 늘지 않거나 매출채권만 증가하면 이연 수요 회수라는 설명을 재검토한다.", "sources": ["meritz", "labor"]}, {"title": "고난도 테스트가 가격 방어력으로 이어질 조건", "status": "증권사 사업 전망 · 매출 기여 미확인", "body": "메리츠는 WMCM 패키징 적용과 CPO 등 비모바일 소켓 확대를 전망했다. 칩 구조가 복잡해지면 테스트 정밀도·신뢰성 요구가 높아진다는 논리가 성장의 근거다. 다만 제품 난도가 높다는 설명만으로 판매단가 상승이나 매출 증가가 입증되는 것은 아니다.", "counter": "개발에서 양산으로 넘어가는 시점, 실제 주문, 단가와 이익률을 함께 확인해야 한다. CPO 기대 매출을 이미 발생한 이익처럼 더하지 않는다. 첨부의 0.15mm 수치와 세부 기여도는 원문 검증 대기다.", "next": "공급 단계·제품 믹스·이익률을 확인한다. 기술 설명은 유지되는데 매출과 수익성이 동반 하락하면 상업적 기여를 다시 점검한다.", "sources": ["meritz"]}, {"title": "회사가 버틸 체력과 주가의 안전마진", "status": "공시 실적 + 현금 사용 계획 점검", "body": "아래 공시 표의 이익률과 투자 후 현금 차액은 재무 체력을 판단할 출발점이다. 높은 수익성과 현금은 침체 때 차입·증자 압력을 줄이는 요인이지만 주가의 특정 가격을 보장하지 않는다.", "counter": "StockEasy는 2025년 말 순현금 4,551억원과 2026년 말 4,780억원 전망을 제시했다. 그러나 같은 답변의 순차입금 수치와 정의가 일치하지 않아 확정 순현금으로 채택하지 않았다. 장기 금융상품의 환금성, 잔여 설비투자·배당·운전자금을 대조해야 한다.", "next": "현금 + 환금 가능한 금융자산 − 이자부채를 같은 기준일로 계산한 뒤 앞으로의 OCF − 설비투자 − 배당 변화를 더해 본다. 금융상품 만기·제약 확인 전에는 전액을 당장 쓸 현금으로 보지 않는다.", "sources": ["annual"]}], "jpg": "dashboard_summary_058470.jpg"}, {"code": "195870", "name": "해성디에스", "documents": {"reader": "stockeasy_195870_reader.html", "source": "stockeasy_195870_source.html", "report": "bear_research_195870.html", "followup": "stockeasy_195870_followup.html"}, "question": "해성디에스 답변의 숫자를 원문 기준으로 재검증해 주세요. 목표가보다 하락장에서 버틸 근거가 목적입니다.\n① 교보 2026-11-02 보고서 3쪽의 현금 11은 단위가 십억원이므로 110억원입니다. 답변 본문의 11억원과 정정해 주세요.\n② 현금흐름 표의 OCF 98·FCF 14도 십억원이면 980억·140억원입니다. 표의 기관·쪽·산식을 밝혀 주세요. 키움 11/03 4쪽 FCF −0.2십억원, 교보 3쪽 −132십억원과 왜 다른지 동일 정의로 연결해 주세요.\n③ 현재가 33,700원의 날짜·거래시장·출처를 확인해 주세요. 당사 11/06 종가는 35,300원입니다. PER 6.8배가 2026년인지 2027년인지도 바로잡아 주세요.\n④ 2만~2.4만원 산식의 평균 EPS/BPS와 흥국 11/04 원문 URL·쪽, 과거 최저 배수 당시 공개된 재무 기준을 제시해 주세요. 과거 배수 적용값과 확정 바닥을 구분해 주세요.\n⑤ 잔여 CAPEX·차입 만기·가용 한도·운전자금·배당을 반영한 12~24개월 현금표를 작성해 주세요. 마진 9%·순차입금비율 30%·이자보상배율 6.9배는 관측값인지 임의 기준인지 구분해 주세요.\n확인 사실·기관 전망·가정·미확인을 나누고, 각 수치에 원문 URL·날짜·단위를 붙여 주세요.", "characters": 632, "reviewed": "2026-11-08", "theses": [{"title": "EPS 격차: 매출보다 영업외손익·세금의 차이를 봐야 한다", "status": "키움 4쪽·교보 3쪽 원문 표 대조 · 연간 전망", "body": "2026년 매출 전망은 키움 8,831억원·교보 약 8,910억원, 영업이익은 1,032억원·약 1,050억원으로 비슷하다. 반면 지배주주 순이익은 820억원·약 680억원, EPS는 4,823원·3,986원으로 벌어진다. 키움은 영업외손익 +20억원, 교보는 약 −190억원을 가정한다. 본업 외 손익·세금 전제의 차이가 EPS를 바꾸므로 낮은 PER만 비교하면 불확실성이 가려진다.", "counter": "기관마다 전망 표의 반올림 정밀도가 다르다. 차입·금융비용 가정이 다르다는 것은 확인되지만 EPS 차이 전부를 이자비용 하나로 설명할 수는 없다. 교보가 더 보수적이라는 이유만으로 실제 이익에 더 가까운지도 아직 검증되지 않았다.", "next": "영업이익 → 영업외손익 → 세전이익 → 세금 → 지배주주 순이익을 기관별로 연결하고 실제 4분기 환손익·금융비용으로 전망을 갱신한다.", "sources": ["kiwoom", "kyobo"]}, {"title": "리드프레임: 재고 보충인가, 지속적인 최종 수요인가", "status": "증권사 사업 조사 · 고객별 주문량 미확인", "body": "키움은 3분기 리드프레임의 높은 가동과 차량·데이터센터 수요를 설명한다. 이 사업의 방어력은 고객이 계속 주문하는지, 원가 상승분을 판가에 반영하는지에 달려 있다. AI 관련 제품이 있다는 것과 회사 전체 수요가 불황에 무관하다는 것은 다르다.", "counter": "연말 고객 재고조정은 주문을 줄일 수 있다. 구리·금 가격과 환율 변동이 판가에 늦게 반영되면 매출 증가 중에도 마진이 낮아질 수 있다. 고객 발언을 해성디에스 주문잔고 확정치로 바꾸어 쓰지 않는다.", "next": "차량용·IT용 매출, 고객 재고 주수, 판가 전가 시차와 가동률을 다음 분기 같은 기준으로 대조한다.", "sources": ["kiwoom", "kyobo"]}, {"title": "DDR5 기판: 매출 증가가 이익 증가로 이어지는 지점", "status": "증권사 파악 · 세부 수익성 공시 대조 필요", "body": "키움은 DDR5가 기판 매출의 절반을 넘고, 패키징기판이 손익분기를 넘었다고 파악했다. 약 60% 초반 가동률에서 물량·수율이 개선된다면 고정비를 나누는 매출이 늘어나는 구조다. 교보도 3분기 기판 흑자전환을 핵심 변화로 제시했다.", "counter": "가동률 상승은 주문이 계속 들어와야 성립한다. 인증·양산 지연, 수율 저하, 경쟁사 공급 복귀가 발생하면 예상한 이익 확대가 늦어진다. DDR5 성장과 장래 패널 공법 투자의 이익을 중복해서 더하지 않는다.", "next": "기판 매출·DDR5 비중·가동률·부문 이익을 묶어 확인한다. 매출만 늘고 이익률이 개선되지 않는 경우를 반증으로 기록한다.", "sources": ["kiwoom", "kyobo"]}, {"title": "3분기 개선은 확인할 단서, 순이익의 질은 별도 점검", "status": "증권사 원문에 인용된 실적 · 잠정공시 직접 대조 대기", "body": "두 원문은 3분기 매출 2,453억원·영업이익 338억원·영업이익률 약 13.8%를 제시한다. 이는 아래 반기 공시 표보다 최근 자료다. 다만 이번 보고서는 잠정공시 본문을 직접 확보하지 못했으므로 이 숫자를 정규화된 확정 재무 표에 섞지 않았다.", "counter": "원문 안에서도 영업이익 전년비 증가율의 표기가 서로 달랐다. 금액이 같다고 모든 설명까지 검증된 것은 아니다. 영업이익과 순이익의 차이, 잠정실적과 확정실적의 정정을 확인해야 한다.", "next": "3분기 분기보고서의 영업외손익·세율·현금흐름을 확인하고, 잠정공시와 숫자가 달라지면 차이를 표시한다.", "sources": ["kiwoom", "kyobo", "q3"]}, {"title": "버틸 현금: 같은 2026년 말 전망이 632억원과 110억원", "status": "기관 전망 원문 대조 · 실제 잔액이나 지급능력 확정 아님", "body": "키움은 2026년 말 현금 632억원·총차입금 1,931억원·순차입금 1,298억원을 전망한다. 교보는 현금 110억원·총차입금 2,790억원으로, 단순 차액은 약 2,680억원이다. 교보 원문 단위는 십억원이므로 현금 11은 11억원이 아니라 110억원이다. 첨부 답변의 본문과 비교표가 이 지점에서 충돌한다.", "counter": "첨부의 2026년 FCF 흑자 설명을 공통 전망으로 채택하지 않았다. 원문 FCF 항목은 키움 약 −2억원, 교보 약 −1,320억원으로 크게 다르며 계산 정의부터 맞춰야 한다. 반기 누적 OCF 약 130.1억원과 유형자산 취득 약 104.0억원의 차액도 완전한 FCF가 아니다. 미래 투자·차입 만기·배당을 충당한다고 단정할 자료가 부족하다.", "next": "신규 투자 공시의 총액·남은 집행·일정, 실제 현금과 만기별 차입금·가용 한도를 확인한다. 기관별 OCF·CAPEX·자산매각·배당을 동일한 정의로 재계산해 12~24개월 현금 계획을 만든다.", "sources": ["half", "kiwoom"]}, {"title": "장부가 근처여도 자산의 회수 가능성을 봐야 한다", "status": "2026E BPS는 키움 전망 · 청산가치 아님", "body": "키움의 2026년 예상 BPS는 36,997원이다. 기준 주가와 비교할 수는 있지만, 공장·재고·매출채권이 장부가대로 현금화된다는 보장은 없다. PBR이 1배 아래라는 이유만으로 가치 바닥을 정하지 않는다.", "counter": "재고 평가손실, 설비 손상, 낮은 ROE가 길어지면 장부가 할인은 지속될 수 있다. 원문에 있는 과거 PER 밴드 눈금을 실제 위기 때의 최저 PER로 읽지 않는다.", "next": "최신 확정 BPS·ROE와 재고 회전·매출채권 회수·가동률을 함께 확인하고, 2018·2020·2022·2024년 저점의 당시 이용 가능한 EPS/BPS로 역사적 범위를 다시 계산한다.", "sources": ["kiwoom", "half"]}, {"title": "2만~2.4만원은 바닥 보장이 아니라 과거 배수 적용 예시", "status": "과거 배수 표 확인 · 당시 이용 가능한 재무 기준은 미검증", "body": "키움 4쪽에는 2024년 최저 PBR 0.62배·2025년 0.54배, 2024년 최저 PER 5.8배가 실제로 기재돼 있다. 다만 이 표만으로 해당 저점 당시에 어떤 EPS/BPS를 알 수 있었는지는 확인되지 않는다. 현재 전망에 과거 최저 배수를 곱한 결과는 재현 가능한 조건부 계산이며, 그 가격에서 하락이 멈춘다는 증거는 아니다.", "counter": "첨부의 2026년 평균 EPS 4,157원·BPS 36,414원에는 이번에 원문을 확보하지 못한 흥국 전망이 포함된다. 평균 입력값을 검증된 단일 적정가로 채택하지 않았다. 이익·장부가가 낮아지거나 과거보다 할인 폭이 커지면 계산 범위 아래로도 내려갈 수 있다.", "next": "저점 날짜의 수정주가·당시 공개 재무·손상차손과 일회성 손익을 맞춘 뒤 비교한다. 9% 마진·30% 순차입금비율·6.9배 이자보상배율도 첨부의 제안 기준으로만 보며 자동 매매 임계값으로 채택하지 않는다.", "sources": ["kiwoom", "kyobo", "stockeasy"]}], "jpg": "dashboard_summary_195870.jpg"}, {"code": "218410", "name": "RFHIC", "documents": {"reader": "stockeasy_218410_reader.html", "source": "stockeasy_218410_source.html", "report": "bear_research_218410.html", "followup": "stockeasy_218410_followup.html"}, "question": "RFHIC 후속 검증입니다. 날짜·공시/리포트 원문 링크·페이지를 붙이고 실적/추정/가정을 나눠 주세요. ① 이연 매출 150~170억원·이익 50~60억원의 직접 근거와 정상화 영업이익 155~165억원 산식. ② 2027 지배순익 662/735억원, EPS 2,491/2,583원, 주식 수 2,657.8만주의 불일치 및 기관별 EPS 2,555/2,680원 차이. 이미 지배 EPS인 수치에 비지배지분을 중복 차감하지 말아 주세요. ③ 계약 합계 919억원에서 기인식 매출을 뺀 실제 잔고와 검수·취소·회수 조건. ④ 2026 OCF 576−CAPEX 250=326억원인데 FCF 200억원인 조정표. ⑤ 통신 정체 EPS 1,994~2,069원의 세금·마진·비지배지분 산식. ⑥ 37,200/45,450원 가격 기준일 통일 및 PER 15/18/25배의 당시 예상이익 기준 역사적 근거. 확인 불가는 미확인으로 표시해 주세요.", "characters": 466, "reviewed": "2026-11-08", "theses": [{"title": "버틸 근거는 방산 주문의 반복 출하와 현금 회수", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "유진 10/28 원문은 3분기 잠정 매출 711억원·영업이익 217억원과 이연 출하 반영을 설명한다. 방산 고객의 후속 주문이 이어지면 통신 투자 부진을 완충할 수 있다. 다만 한 분기 이익을 정상 이익으로 연율화할 근거는 부족하다.", "counter": "방산 납품·검수가 지연되고 매출채권·재고가 늘면 이익과 현금이 함께 약해진다. 계약 원금 919억원은 기인식 매출을 빼지 않은 금액이므로 남은 잔고로 채택하지 않는다.", "next": "다음 분기에 해외·국내 방산별 출하, 신규 계약, 매출채권 회수와 OCF를 대조한다. 출하는 늘어도 마진·현금이 동반 악화되면 방어 논리를 재검토한다.", "sources": ["r0", "r1"]}, {"title": "현금 차액을 임의 항목으로 메우지 않는다", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "신한 10/28 현금흐름표의 2026F OCF는 576억원, 유형 투자 250억원, 무형 투자 30억원이다. 단순 투자 후 차액은 296억원이며 원문의 FCF 200억원과 96억원 차이가 남는다. 모두 연간 전망이다.", "counter": "후속 답변의 기타 조정 96억원은 차액을 역산한 설명일 뿐 해당 항목의 원문 근거를 확인하지 못했다. 표에서 576억원을 576십억원으로 쓴 단위 오류도 있다. OCF에 반영된 운전자본을 다시 빼면 중복 차감이다.", "next": "FCF 정의를 확인하기 전에는 296억원을 단순 OCF−유형·무형 투자로만 표시한다. 배당·차입상환·금융자산 변동을 별도로 연결해 실제 기말 현금을 확인한다.", "sources": ["r0"]}, {"title": "정상화 EPS와 역사적 저점은 아직 가정", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "원문 2027F EPS는 신한 2,555원·유진 2,680원이다. 217억원에서 미확인 이연이익 50~60억원을 빼면 157~167억원이지 155~165억원의 직접 입증은 아니다.", "counter": "통신 정체 EPS 1,994~2,069원은 방산 매출·마진·영업외이익·세율·비지배지분 가정을 묶은 시나리오다. 주식 수 역산만으로 희석증권 차이라고 확정할 수 없다. PER 15배가 역사적 바닥이라는 당시 전망 자료도 없다.", "next": "정상 출하와 이연 출하를 나눈 후 같은 기관의 지배순익·가중평균 주식 수로 EPS를 연결한다. 이미 지배 EPS인 숫자에서 비지배지분을 다시 차감하지 않는다.", "sources": ["r0", "r1"]}, {"title": "매출이 늘어도 제품 구성에 따라 마진은 낮아진다", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "유진의 4분기 전망은 매출 1,014억원·영업이익 210억원이다. 3분기보다 매출은 크지만 영업이익은 작아 제품·고객 구성의 영향을 보여 준다.", "counter": "해외 방산과 국내 방산의 수익성 차이, RF머트리얼즈의 실적 및 비지배지분을 구분하지 않으면 RFHIC 주주에게 귀속되는 이익을 잘못 계산한다.", "next": "해외·국내 방산·통신별 매출과 마진을 연결하고 RF머트리얼즈 이익의 비지배지분 차감을 EPS까지 설명해 달라.", "sources": ["r0", "r1"]}, {"title": "낮아진 주가와 낮아진 이익 전망을 함께 보기", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "2027년 EPS는 신한 2,555원, 유진 2,680원이다. 유진은 긍정적인 사업 전망과 함께 2027년 영업이익 추정치를 낮췄다.", "counter": "보고서 제목이나 목표가만 읽으면 추정 하향을 놓친다. 통신 설비투자 회복과 신규 공급업체 진입 기대를 확정 수주로 합산하면 안 된다.", "next": "직전 동일 기관 전망 대비 하향 원인을 수량·판가·마진으로 설명하고, 통신 회복을 제외해도 성립하는 EPS를 제시해 달라.", "sources": ["r0", "r1"]}, {"title": "성장보다 먼저 확인할 현금 전환", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "방산 매출은 납기·검수와 대금 수령 사이에 시차가 생길 수 있다. 영업현금흐름과 매출채권·재고를 함께 보는 것이 하락장에서의 방어력 점검이다.", "counter": "매출 증가만으로 운전자금 부담을 덮을 수 없다. 증설비와 지분투자·배당까지 반영해야 실제 사용할 수 있는 현금을 알 수 있다.", "next": "분기별 매출채권 회수·재고 증가·잔여 CAPEX·차입 만기를 연결한 12~24개월 현금 계획을 제시해 달라.", "sources": ["r0", "r1"]}], "jpg": "dashboard_summary_218410.jpg"}, {"code": "267260", "name": "HD현대일렉트릭", "documents": {"reader": "stockeasy_267260_reader.html", "source": "stockeasy_267260_source.html", "report": "bear_research_267260.html", "followup": "stockeasy_267260_followup.html"}, "question": "HD현대일렉트릭 후속 검증입니다. 원문 링크·페이지·기준일을 붙이고 미확인 항목은 미확인으로 남겨 주세요. ① 수주잔고 88.4억달러의 납품 연도/제품/지역별 구성과 실제 공개된 취소·위약금·원가 연동·관세 부담 조건. ② 1.1조원 패키지 계약의 2026/2027/2028 매출 인식·선수금·잔금 일정. ③ 울산·청주·앨라배마의 승인 총예산/누적 집행/잔여 CAPEX를 같은 기준일로 정리. 목표 생산능력과 실제 가동률을 구분. ④ OCF·CAPEX·FCF를 한 기관·한 연도로 맞추고 운전자금·계약부채 변동 및 차입 만기를 대조. ⑤ 정상화 EPS 28,000~36,000원과 PER 12~16배의 역사적 근거. 2027년 자체 EPS 28,563/29,314원과 2028년 목표가의 할인 전제를 분리. ⑥ 영업이익률 23%를 무효 조건으로 삼는 근거와 주문 정상화·환율/관세 충격 시 손익 민감도를 밝혀 주세요.", "characters": 457, "reviewed": "2026-11-08", "theses": [{"title": "큰 잔고보다 고마진 납품과 대금 회수가 중요하다", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "하나 10/28 원문은 수주잔고 88.4억달러, 북미 비중 68.1%, 3분기 이익률 24.1%를 제시한다. 수년치 납품 가시성이 근거지만 제품·지역 믹스에 따라 같은 매출의 이익은 달라진다.", "counter": "원가·관세 전가 실패, 납품 지연, 재고·채권 증가가 겹치면 잔고가 현금 방어력으로 이어지지 않는다. 계약 취소·가격 연동 세부 조항은 미확인이고 이익률 23%를 절대 방어선으로 채택하지 않는다.", "next": "중저압차단기 판가 인상과 북미 출하가 실제 마진·OCF로 연결되는지 본다. 신공장 완공과 실제 가동률을 나누고 잔고가 늘어도 현금 회수가 나빠지면 방어 논리를 재검토한다.", "sources": ["r0", "r1"]}, {"title": "증설은 완료보다 실제 가동과 현금 전환으로 확인", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "하나 원문은 울산 신공장 11월 양산 예정과 청주 2단계 투자에 따른 2028년 추가 매출을 전망한다. 데이터센터 공급의 PO 발주 개시와 추가 계약 협의도 설명한다. 예정·협의를 실적·확정 수주로 바꾸지 않는다.", "counter": "후속 답변의 공장별 잔여 투자·완전 가동 시점은 동일 기준일 자료가 부족하다. 선수금은 향후 납품 의무가 있는 자금이며 순현금과 합쳐 자유 현금으로 중복 계산할 수 없다.", "next": "공장별 투자 집행·잔여 약정, 재고·채권·계약부채와 현금 회수를 대조한다. 경쟁사 증설에 따른 신규 수주 단가 하락도 확인하되 환율·관세 1~2%p 손익 효과는 근거 없는 확정 수치로 쓰지 않는다.", "sources": ["r0"]}, {"title": "2027년 이익과 2028년 목표가를 섞지 않는다", "status": "2026-11-08 원문 부분 대조 · 관찰 조건", "body": "2027F EPS는 하나 28,563원·한화 29,314원이다. 하나의 목표가는 2028년 예상 EPS에 PER 27배를 적용한 것으로 현재의 가치 하단과 다르다.", "counter": "EPS 28,000~36,000원과 PER 12~16배는 검증된 정상 이익·역사적 최저 배수 조합이 아니다. 후속 답변의 기관 A~D 표는 기관명·날짜 연결이 없어 기존 원문 전망을 대체하지 않는다.", "next": "동일 기관의 이익 전망 수정과 가격 하락을 함께 비교한다. 장기 목표가의 할인·배수 가정과 하락장 스트레스 시나리오를 나누고 자동 매수·손절 기준을 변경하지 않는다.", "sources": ["r0", "r1"]}, {"title": "데이터센터 계약은 인도 일정과 현금까지 연결", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "한화는 빅테크 패키지 계약과 2026년 말 이후 순차 납품을 성장 근거로 제시한다. 계약 총액과 한 해 매출은 다른 숫자다.", "counter": "고객 투자 일정이 늦어지거나 검수가 지연되면 매출 인식과 대금 회수도 달라진다. 선수금은 향후 생산 의무를 동반한다.", "next": "공시된 계약 금액·기간·선수금·검수 조건을 확인하고 예정 매출과 현금 회수표를 작성해 달라.", "sources": ["r0", "r1"]}, {"title": "증설은 2027년 이익과 투자 지출을 함께 바꾼다", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "2027년 자체 EPS 전망은 하나 28,563원, 한화 29,314원이다. 생산능력 확대는 기회지만 가동·인력 숙련·수율이 이익 전환 속도를 결정한다.", "counter": "공장 준공을 곧바로 완전 가동으로 계산하면 매출과 마진을 과대평가한다. 증설비·운전자금 지출은 매출보다 먼저 발생할 수 있다.", "next": "울산·청주 증설의 승인 CAPEX·남은 집행·가동 시점·수율·인력 비용과 차입 만기를 정리해 달라.", "sources": ["r0", "r1"]}, {"title": "목표가의 2028년과 현재 비교의 2027년 구분", "status": "증권사 원문 대조 · 전망과 추가 확인 구분", "body": "한화 목표 산식은 2028년 EPS 36,155원과 22배를 사용한다. 본 보고서의 비교 연도는 2027년이며 이 목표가를 동일 연도 비교로 복사하지 않았다.", "counter": "먼 미래 실적과 높은 배수를 할인 없이 현재 가치로 읽으면 하락 위험을 가릴 수 있다. 주문 정상화와 배수 축소가 동시에 발생하는 경우를 확인해야 한다.", "next": "2028년 목표를 현재 가치로 환산한 전제와 2027년 정상화 EPS를 제시하고, 과거 저점 자료의 시점 일치 여부를 확인해 달라.", "sources": ["r0", "r1"]}], "jpg": "dashboard_summary_267260.jpg"}, {"code": "352820", "name": "하이브", "documents": {"reader": "stockeasy_352820_reader.html", "source": "stockeasy_352820_source.html", "report": "bear_research_352820.html", "followup": "stockeasy_352820_followup.html"}, "question": "하이브 후속 대조입니다. 원문 링크·페이지·기준일을 붙이고 확인 불가는 미확인으로 표시해 주세요. ① 3Q 지배순손실 68억원인데 표 EPS +262원인 이유: 전체 연결/지배 이익, 가중평균 주식 수로 재계산. ② 2026 EPS 하나 692·한화 2,097원의 영업외손익→세금→지배 (()=>{const tabs=[...document.querySelectorAll('[data-code]')],views=[...document.querySelectorAll('[data-view]')],frame=document.getElementById('document');let selected, view;
const marketLink=document.getElementById('market-link');
const picker=document.getElementById('stock-picker');
picker.addEventListener('change',()=>{selected=stocks.find(s=>s.code===picker.value);saveSelection();});
function showMobile(){
    picker.value=selected.code;
    const box=document.getElementById('mobile-evidence');box.replaceChildren();
    const thesis=(selected.theses||[])[0]||{};
    for(const [key,label] of [['body','버틸 근거'],['counter','재검토할 조건'],['next','다음 확인']]){
        const title=document.createElement('h3'),text=document.createElement('p');
        title.textContent=label;text.textContent=thesis[key]||'검토 자료 없음';box.append(title,text);
    }
    const jpg=document.getElementById('summary-jpg');jpg.hidden=!selected.jpg;
    if(selected.jpg)jpg.href=selected.jpg;else jpg.removeAttribute('href');
}
function restoreSelection(){
    let selection=location.hash.slice(1);
    if(!selection){
        try{selection=sessionStorage.getItem('stockagent-research-selection')||'';}catch(error){selection='';}
    }
    const [code, kind]=selection.split('/');
    selected=stocks.find(stock=>stock.code===code)||stocks[0];
    view=views.some(button=>button.dataset.view===kind)?kind:'reader';
    if(selected)showMobile();
    show();
}
function saveSelection(){
    const selection=selected.code+'/'+view;
    history.replaceState(null,'','#'+selection);
    try{sessionStorage.setItem('stockagent-research-selection',selection);}catch(error){/* URL retains selection. */}
    showMobile();
    show();
}
window.addEventListener('hashchange',restoreSelection);
function show(){if(!selected)return;marketLink.href='market_context.html#'+selected.code;tabs.forEach(t=>{const active=t.dataset.code===selected.code;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;});document.getElementById('stock-panel').setAttribute('aria-labelledby','tab-'+selected.code);document.getElementById('stock-title').textContent=selected.name;document.getElementById('reviewed').textContent='내용 검토 '+selected.reviewed+' · 자료별 가격 기준일은 각 본문 확인';views.forEach(v=>v.setAttribute('aria-pressed',String(v.dataset.view===view)));const url=selected.documents[view],link=document.getElementById('open-page'),missing=document.getElementById('missing'),loading=document.getElementById('loading');frame.hidden=true;link.hidden=!url;missing.hidden=!!url;loading.hidden=!url;if(url){loading.textContent=selected.name+' 자료를 불러오는 중입니다.';frame.onload=()=>{try{if(new URL(frame.contentWindow.location.href).pathname.endsWith('/'+url)){frame.hidden=false;loading.hidden=true;}}catch(error){loading.textContent='화면 안에서 읽을 수 없습니다. 선택한 자료 크게 열기를 이용해 주세요.'}};frame.src=url;frame.title=selected.name+' · '+views.find(v=>v.dataset.view===view).textContent;link.href=url;}else{frame.onload=null;frame.removeAttribute('src');link.removeAttribute('href');missing.textContent=selected.name+'의 이 자료는 아직 미등록입니다. 다른 자료 종류를 선택해 주세요.';}document.getElementById('question').value=selected.question||'후속 질문 준비 중';document.getElementById('characters').textContent=selected.characters+'자 / 950자 미만 (줄바꿈 포함)';document.getElementById('copy').disabled=!selected.question;document.getElementById('copy-status').textContent='';}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>{selected=stocks.find(s=>s.code===t.dataset.code);saveSelection();});t.addEventListener('keydown',e=>{let next;if(e.key==='ArrowRight')next=(i+1)%tabs.length;if(e.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;if(e.key==='Home')next=0;if(e.key==='End')next=tabs.length-1;if(next!==undefined){e.preventDefault();tabs[next].click();tabs[next].focus();}});});views.forEach(v=>v.addEventListener('click',()=>{view=v.dataset.view;saveSelection();}));document.getElementById('copy').addEventListener('click',async()=>{const text=document.getElementById('question'),status=document.getElementById('copy-status');try{await navigator.clipboard.writeText(text.value);status.textContent='질문을 복사했습니다.';}catch(err){text.focus();text.select();status.textContent='자동 복사를 사용할 수 없습니다. 선택된 문장을 길게 누르거나 Ctrl+C로 복사하세요.'}});restoreSelection();})();
</script></body></html>
